<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Contacto - GLPFinder</title>
    
    <link rel="icon" type="image/png" href="LogoPequeño.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- He añadido unos estilos rápidos aquí para que el formulario y los datos no se vean descolocados. Luego puedes moverlos a tu styles.css -->
    <style>
        .contacto-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
            text-align: left;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #334155;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-family: inherit;
        }
        .btn-enviar {
            background-color: #2563eb;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        .btn-enviar:hover {
            background-color: #1d4ed8;
        }
        @media (max-width: 768px) {
            .contacto-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">
            <img src="Logo.png" alt="Logo GLPFinder">
        </a>
        
        
        <div class="nav-links">
            <a href="index.html">Mapa</a>
            <a href="auth.html" id="nav-auth">Acceder / Registro</a>
            
            <div class="profile-dropdown" id="nav-profile" style="display: none;">
                <button class="profile-btn">Perfil <span>▼</span></button>
                <div class="dropdown-content">
                    <a href="datos.html">Mis datos</a>
                    <a href="favoritas.html">Mis favoritas</a>
                    <a href="#" id="btn-logout" class="logout-option">Cerrar sesión</a>
                </div>
            </div>
        </div>
    </header>

    <main class="contacto-container" style="padding: 20px; max-width: 1000px; margin: 0 auto; text-align: center;">
        
        <h1 style="color: #1e293b; margin-bottom: 10px;">Contacto y Soporte</h1>
        <p style="color: #64748b; margin-bottom: 30px;">¿Tienes alguna duda o quieres registrar tu gasolinera? Escríbenos.</p>
        
        <!-- SECCIÓN DE DATOS Y ENCUESTA -->
        <div class="contacto-grid">
            
            <!-- DATOS DE LA EMPRESA -->
            <div class="datos-empresa" style="background: #f8fafc; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0;">
                <h2 style="font-size: 20px; margin-bottom: 15px; color: #0f172a;">Nuestras Oficinas</h2>
                <p style="margin-bottom: 10px;"><strong>GLPFinder España</strong></p>
                <p style="margin-bottom: 10px;">📍 Calle Mercator 2, 28000, Madrid</p>
                <p style="margin-bottom: 10px;">📧 glpfinder1@gmail.com</p>
            </div>

            <!-- ENCUESTA / FORMULARIO -->
            <div class="encuesta-formulario">
                <form action="#" method="POST" onsubmit="event.preventDefault(); alert('Formulario de prueba enviado');">
                    <div class="form-group">
                        <label for="nombre">Nombre completo</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" name="email" placeholder="tu@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="motivo">Motivo de la consulta</label>
                        <select id="motivo" name="motivo" required>
                            <option value="">Selecciona una opción...</option>
                            <option value="soporte">Problemas con mi cuenta</option>
                            <option value="gasolinera">Añadir/Modificar gasolinera</option>
                            <option value="sugerencia">Sugerencia para el mapa</option>
                            <option value="otros">Otros</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="mensaje">Tu mensaje</label>
                        <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe aquí tu consulta..." required></textarea>
                    </div>
                    <button type="submit" class="btn-enviar">Enviar Mensaje</button>
                </form>
            </div>

        </div>

        <!-- MAPA DE CONTACTO -->
        <h2 style="font-size: 20px; margin-top: 40px; margin-bottom: 15px; color: #0f172a;">Encuéntranos en el mapa</h2>
        <div id="mapa-contacto" style="width: 100%; height: 400px; border-radius: 12px; border: 2px solid #e2e8f0; z-index: 1;"></div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // COORDENADAS: Sustituye estos dos valores por los exactos de tu edificio en Calle Mercator 2
        const latitudEmpresa = 40.38936; 
        const longitudEmpresa = -3.62989; 
        
        const mapaContacto = L.map('mapa-contacto').setView([latitudEmpresa, longitudEmpresa], 16);
        
        L.tileLayer('https://mt1.google.com/vt/lyrs=m&hl=es&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            attribution: '© Google'
        }).addTo(mapaContacto);

        L.marker([latitudEmpresa, longitudEmpresa]).addTo(mapaContacto)
            .bindPopup('<b style="color:#2563eb;">GLPFinder</b><br>Calle Mercator 2, Madrid.')
            .openPopup();
    </script>

    <!-- SCRIPT DE SESIÓN (FIREBASE) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB_2thDoQUjLM34QYO8nmaDAB8HqQIxtIY",
            authDomain: "glpfinder.firebaseapp.com",
            projectId: "glpfinder",
            storageBucket: "glpfinder.firebasestorage.app",
            messagingSenderId: "173596798895",
            appId: "1:173596798895:web:d883035f89fa2c139fc95a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const navAuth = document.getElementById('nav-auth');
        const navProfile = document.getElementById('nav-profile');
        const btnLogout = document.getElementById('btn-logout');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                if(navAuth) navAuth.style.display = 'none';
                if(navProfile) navProfile.style.display = 'inline-block';
            } else {
                if(navAuth) navAuth.style.display = 'inline-block';
                if(navProfile) navProfile.style.display = 'none';
            }
        });

        if (btnLogout) {
            btnLogout.addEventListener('click', (e) => {
                e.preventDefault();
                signOut(auth).then(() => {
                    window.location.reload();
                });
            });
        }
    </script>
</body>
</html>
