<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - GLPFinder</title>

    <!-- Tu archivo de estilos principal -->
    <link rel="stylesheet" href="styles.css">

    <!-- CSS de Leaflet (Obligatorio para que el mapa se vea bien) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
</head>
<body>

    <!-- BARRA DE NAVEGACIÓN -->
    <!-- MUY IMPORTANTE: Asegúrate de que los id="" de los botones sean EXACTAMENTE los mismos que tienes en tu index.html -->
    <nav class="navbar">
        <div class="nav-logo">
            <a href="index.html">GLPFinder</a>
        </div>
        <div class="nav-links">
            <a href="index.html">Mapa</a>
            <a href="contacto.html">Contacto</a>
        </div>
        
        <!-- Zona de usuario / Sesión -->
        <div class="auth-container">
            <button id="btn-login" class="btn-login">Iniciar Sesión / Registrarse</button>
            <div id="user-profile" style="display: none;">
                <img id="user-pic" src="" alt="Perfil" class="profile-pic">
                <button id="btn-logout">Salir</button>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO DE CONTACTO -->
    <main style="padding: 20px; max-width: 800px; margin: 0 auto;">
        <h1>Contacta con nosotros</h1>
        <p>¿Tienes alguna duda o sugerencia? Rellena el formulario o encuéntranos en nuestras oficinas.</p>

        <!-- EL MAPA DE CONTACTO (Altura fija puesta para evitar que colapse a 0px) -->
        <div id="mapa-contacto" style="width: 100%; height: 400px; border-radius: 12px; margin: 20px 0; border: 2px solid #ccc; z-index: 1;"></div>

        <!-- Aquí puedes meter tu formulario HTML normal -->
    </main>

    <!-- SCRIPT DE LEAFLET (Obligatorio para el mapa) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- SCRIPT DEL MAPA DE CONTACTO -->
    <script>
        // Coordenadas de ejemplo (Madrid centro). Cámbialas por las que necesites.
        const coordsUbicacion = [40.4168, -3.7038];
        
        // Inicializamos el mapa en el contenedor "mapa-contacto"
        const mapaContacto = L.map('mapa-contacto').setView(coordsUbicacion, 15);

        // Añadimos la capa de Google Calles
        L.tileLayer('https://mt1.google.com/vt/lyrs=m&hl=es&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            attribution: '© Google'
        }).addTo(mapaContacto);

        // Añadimos un marcador
        L.marker(coordsUbicacion).addTo(mapaContacto)
            .bindPopup('<b>GLPFinder</b><br>Nuestra ubicación.')
            .openPopup();
    </script>

    <!-- SCRIPT DE FIREBASE Y LÓGICA DE SESIÓN -->
    <!-- Sustituye "tu-archivo-firebase.js" por el nombre real del archivo JS donde tienes la lógica de inicio de sesión de tu index.html -->
    <script type="module" src="tu-archivo-firebase.js"></script>

</body>
</html>
