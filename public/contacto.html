<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - GLPFinder</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
</head>
<body>

    <!-- BARRA DE NAVEGACIÓN -->
    <nav class="navbar">
        <div class="nav-logo">
            <a href="index.html">GLPFinder</a>
        </div>
        <div class="nav-links">
            <a href="index.html">Mapa</a>
            <a href="contacto.html">Contacto</a>
        </div>
        
        <div class="auth-container">
            <button id="btn-login" class="btn-login">Iniciar Sesión / Registrarse</button>
            <div id="user-profile" style="display: none; align-items: center; gap: 10px;">
                <!-- Añadido un estilo básico a la foto para que no se desmadre el tamaño -->
                <img id="user-pic" src="" alt="Perfil" class="profile-pic" style="width: 32px; height: 32px; border-radius: 50%;">
                <button id="btn-logout">Salir</button>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO -->
    <main style="padding: 20px; max-width: 800px; margin: 0 auto;">
        <h1>Contacta con nosotros</h1>
        <p>Encuéntranos en nuestras oficinas.</p>

        <!-- MAPA -->
        <div id="mapa-contacto" style="width: 100%; height: 400px; border-radius: 12px; margin: 20px 0; border: 2px solid #ccc; z-index: 1;"></div>
    </main>

    <!-- 1. SCRIPT DE LEAFLET -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        const mapaContacto = L.map('mapa-contacto').setView([40.4168, -3.7038], 15);
        L.tileLayer('https://mt1.google.com/vt/lyrs=m&hl=es&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            attribution: '© Google'
        }).addTo(mapaContacto);

        L.marker([40.4168, -3.7038]).addTo(mapaContacto)
            .bindPopup('<b>GLPFinder</b><br>Nuestra ubicación.')
            .openPopup();
    </script>

    <!-- 2. SCRIPT DE FIREBASE -->
    <script type="module">
        // Importamos Firebase Auth directamente desde el CDN de Google
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // ¡ATENCIÓN! -> SUSTITUYE ESTO POR TU CONFIGURACIÓN REAL DE FIREBASE (La misma que tienes en index.html)
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "glpfinder.firebaseapp.com",
            projectId: "glpfinder",
            storageBucket: "glpfinder.appspot.com",
            messagingSenderId: "TU_ID",
            appId: "TU_APP_ID"
        };

        // Inicializamos la app y la autenticación
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Capturamos los elementos del menú
        const btnLogin = document.getElementById('btn-login');
        const userProfile = document.getElementById('user-profile');
        const userPic = document.getElementById('user-pic');
        const btnLogout = document.getElementById('btn-logout');

        // Comprobamos si el usuario ya tiene la sesión iniciada
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Está logueado: Ocultamos botón de login y mostramos perfil
                btnLogin.style.display = 'none';
                userProfile.style.display = 'flex';
                // Si el usuario tiene foto en Google, la mostramos. Si no, dejamos un icono por defecto
                userPic.src = user.photoURL || 'https://www.gravatar.com/avatar/00000000000000000000000000000000?d=mp&f=y';
            } else {
                // No está logueado: Mostramos botón de login
                btnLogin.style.display = 'block';
                userProfile.style.display = 'none';
            }
        });

        // Configurar botón de Salir
        if (btnLogout) {
            btnLogout.addEventListener('click', () => {
                signOut(auth).then(() => {
                    // Al cerrar sesión, recargamos la página para que la interfaz se actualice
                    window.location.reload();
                }).catch((error) => {
                    console.error("Error cerrando sesión:", error);
                });
            });
        }

        // Configurar botón de Login (Redirige al index para que haga el login ahí, es lo más limpio)
        if (btnLogin) {
            btnLogin.addEventListener('click', () => {
                window.location.href = "index.html"; 
            });
        }
    </script>

</body>
</html>
