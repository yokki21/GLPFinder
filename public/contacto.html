<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Contacto - GLPFinder</title>
    
    <link rel="icon" type="image/png" href="LogoPequeño.png">
    <link rel="stylesheet" href="styles.css">
    <!-- LEAFLET CSS para el mapa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

    <!-- TU CABECERA REAL (Idéntica a la de index.html) -->
    <header>
        <a href="index.html" class="logo">
            <img src="Logo.png" alt="Logo GLPFinder">
        </a>
        <div class="nav-links">
            <a href="contacto.html">Contacto</a>
            <a href="auth.html" id="nav-auth">Acceder / Registro</a>
            
            <div class="profile-dropdown" id="nav-profile" style="display: none;">
                <button class="profile-btn">Perfil <span>▼</span></button>
                <div class="dropdown-content">
                    <a href="datos.html">Mis datos</a>
                    <a href="favoritas.html">Mis favoritas</a>
                    <a href="#" id="btn-logout" class="logout-option">Cerrar sesión</a>
                </div>
            </div>
        </div>
    </header>

    <!-- CONTENIDO DE LA PÁGINA DE CONTACTO -->
    <main class="contacto-container" style="padding: 20px; max-width: 1000px; margin: 0 auto; text-align: center;">
        <h1 style="color: #1e293b; margin-bottom: 10px;">Contacta con GLPFinder</h1>
        <p style="color: #64748b; margin-bottom: 20px;">Encuentra nuestras oficinas centrales en el mapa o escríbenos para cualquier consulta.</p>

        <!-- MAPA DE CONTACTO -->
        <div id="mapa-contacto" style="width: 100%; height: 400px; border-radius: 12px; margin-top: 20px; border: 2px solid #e2e8f0; z-index: 1;"></div>
    </main>

    <!-- 1. SCRIPT DEL MAPA DE CONTACTO (LEAFLET) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inicializa el mapa en las coordenadas de contacto (puedes cambiarlas por tu ciudad)
        const mapaContacto = L.map('mapa-contacto').setView([40.4168, -3.7038], 15);
        
        // Capa de Google Calles
        L.tileLayer('https://mt1.google.com/vt/lyrs=m&hl=es&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            attribution: '© Google'
        }).addTo(mapaContacto);

        // Marcador con Popup
        L.marker([40.4168, -3.7038]).addTo(mapaContacto)
            .bindPopup('<b style="color:#2563eb;">GLPFinder</b><br>Nuestras oficinas centrales.')
            .openPopup();
    </script>

    <!-- 2. SCRIPT DE SESIÓN (FIREBASE) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // TUS CREDENCIALES REALES
        const firebaseConfig = {
            apiKey: "AIzaSyB_2thDoQUjLM34QYO8nmaDAB8HqQIxtIY",
            authDomain: "glpfinder.firebaseapp.com",
            projectId: "glpfinder",
            storageBucket: "glpfinder.firebasestorage.app",
            messagingSenderId: "173596798895",
            appId: "1:173596798895:web:d883035f89fa2c139fc95a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Control de los botones de la cabecera
        const navAuth = document.getElementById('nav-auth');
        const navProfile = document.getElementById('nav-profile');
        const btnLogout = document.getElementById('btn-logout');

        // Escuchador de sesión: Cambia el menú si el usuario está dentro
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Usuario logueado: Oculta "Acceder" y muestra el desplegable "Perfil"
                if(navAuth) navAuth.style.display = 'none';
                if(navProfile) navProfile.style.display = 'inline-block';
            } else {
                // Usuario NO logueado: Muestra "Acceder" y oculta "Perfil"
                if(navAuth) navAuth.style.display = 'inline-block';
                if(navProfile) navProfile.style.display = 'none';
            }
        });

        // Configuración del botón Cerrar Sesión
        if (btnLogout) {
            btnLogout.addEventListener('click', (e) => {
                e.preventDefault();
                signOut(auth).then(() => {
                    window.location.reload(); // Recarga la página al salir
                }).catch((error) => {
                    console.error("Error al cerrar sesión:", error);
                });
            });
        }
    </script>
</body>
</html>
