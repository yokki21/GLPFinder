<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GLPFinder</title>
    <link rel="icon" type="image/png" href="LogoPequeño.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        @keyframes girarSpinner { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="pantallaCarga" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.85); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(4px);">
        <div style="width: 50px; height: 50px; border: 5px solid #e2e8f0; border-top-color: #2563eb; border-radius: 50%; animation: girarSpinner 1s linear infinite;"></div>
        <p id="textoCarga" style="margin-top: 20px; font-weight: bold; color: #1e293b; font-size: 18px; text-align: center;">Iniciando GLPFinder...</p>
    </div>

    <header>
        <a href="index.html" class="logo">
            <img src="Logo.png" alt="Logo GLPFinder">
        </a>
        <div class="nav-links">
            <a href="contacto.html">Contacto</a>
            <a href="auth.html" id="nav-auth">Acceder / Registro</a>
            <div class="profile-dropdown" id="nav-profile" style="display: none;">
                <button class="profile-btn">Perfil</button>
                <div class="dropdown-content">
                    <a href="datos.html">Mis datos</a>
                    <a href="favoritas.html">Mis favoritas</a>
                    <a href="#" id="btn-logout" class="logout-option">Cerrar sesión</a>
                </div>
            </div>
        </div>
    </header>

    <main class="map-main">
        <div class="search-wrapper">
            <div class="search-container-box">
                <div class="search-controls">
                    <input type="text" id="searchInput" placeholder="Municipio, calle, CP..." oninput="manejarEntrada()" onkeydown="if(event.key==='Enter'){ event.preventDefault(); buscarUbicacion(); }" autocomplete="off">
                    <button onclick="buscarUbicacion()" class="btn-search">Buscar</button>
                    <button class="btn-icon" onclick="toggleFiltros()" title="Filtrar resultados">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                        </svg>
                    </button>
                </div>
                <ul id="searchResults" class="search-results"></ul>
            </div>

            <div id="routePanel" class="route-panel hidden">
                <div class="route-panel-header" style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px;">
                    <div style="flex-grow: 1; padding-right: 10px;">
                        <h4 style="margin: 0 0 4px 0; font-size: 13px; color: #64748b; text-transform: uppercase;">Ruta hacia</h4>
                        <p id="routeDestinationLabel" class="route-destination-label" style="margin: 0; font-size: 16px; font-weight: bold; color: #0f172a; line-height: 1.2;">Destino no seleccionado</p>
                    </div>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <button id="btnMinimizarRuta" onclick="window.toggleMinimizarRuta()" style="background: #e2e8f0; border: none; width: 32px; height: 32px; border-radius: 6px; font-weight: bold; color: #475569; cursor: pointer; display: none; font-size: 16px; line-height: 1; justify-content: center; align-items: center;">-</button>
                        <button class="route-clear-btn" onclick="cerrarPanelRuta()" title="Cerrar panel" style="width: 32px; height: 32px; padding: 0; display: flex; justify-content: center; align-items: center; border-radius: 6px; background: #fef2f2; color: #ef4444; border: 1px solid #fecaca; font-weight: bold; cursor: pointer;">X</button>
                    </div>
                </div>
                
                <button id="btnProgramarRuta" onclick="window.mostrarDetallesRuta()" style="width: 100%; background: #2563eb; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 5px; font-size: 15px;">Programar Ruta</button>

                <div id="routeDetailsFields" class="hidden" style="margin-top: 15px;">
                    <div class="route-field-group">
                        <label for="routeOriginInput">Origen</label>
                        <div class="route-origin-row">
                            <input type="text" id="routeOriginInput" placeholder="Ubicación actual (por defecto)" oninput="manejarEntradaOrigen()" onkeydown="if(event.key==='Enter'){ event.preventDefault(); buscarOrigen(); }" autocomplete="off">
                            <button class="btn-route btn-route-square" onclick="calcularRutaDesdePanel()" title="Calcular ruta">Ir</button>
                        </div>
                        <ul id="originResults" class="search-results"></ul>
                    </div>

                    <div class="route-field-group" style="margin-top: 15px;">
                        <label for="routeDesvioInput" style="display: block; margin-bottom: 5px; font-weight: bold; color: #334155;">Desvío máximo permitido</label>
                        <select id="routeDesvioInput" onchange="reaplicarFiltroRuta()" style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; background-color: white;">
                            <option value="2">Muy cerca (2 km)</option>
                            <option value="5" selected>Normal (5 km)</option>
                            <option value="10">Desvío moderado (10 km)</option>
                            <option value="25">Ruta larga / Mucho desvío (25 km)</option>
                            <option value="50">Cualquier gasolinera en la región (50 km)</option>
                        </select>
                    </div>

                    <div id="routeMessage" class="route-message"></div>

                    <div id="routeStopsContainer" style="display: none; margin-top: 15px; border-top: 1px solid #cbd5e1; padding-top: 15px;">
                        <h5 style="margin: 0 0 10px 0; font-size: 13px; color: #334155;">Paradas en ruta (<span id="stopsCount">0</span>)</h5>
                        <ul id="stopsList" style="list-style: none; padding: 0; margin: 0 0 10px 0; font-size: 12px; color: #475569;"></ul>
                    </div>
                </div>

                <button id="btnRutaGoogleMaps" onclick="window.abrirRutaEnGoogleMaps()" style="width: 100%; background: #16a34a; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; font-size: 15px; display: none;">Abrir ruta en Google Maps</button>
            </div>

            <div id="panelFiltros" class="filter-panel" style="display: none;">
                <h4>Filtros</h4>
                <div class="filter-group">
                    <label>Precio Máximo: <span id="priceLabel" class="filter-val">1.50 €/L</span></label>
                    <input type="range" id="filterPrice" min="0.50" max="1.50" step="0.01" value="1.50" oninput="aplicarFiltros()">
                </div>
                <div class="filter-group">
                    <label>Distancia Máxima: <span id="distanceLabel" class="filter-val">Cualquiera</span></label>
                    <input type="range" id="filterDistance" min="0" max="50" step="1" value="0" oninput="aplicarFiltros()">
                </div>
                <div class="filter-group">
                    <label>Marcas</label>
                    <div class="brand-grid">
                        <label><input type="checkbox" value="REPSOL" onchange="aplicarFiltros()"> Repsol</label>
                        <label><input type="checkbox" value="CEPSA" onchange="aplicarFiltros()"> Cepsa/Moeve</label>
                        <label><input type="checkbox" value="GALP" onchange="aplicarFiltros()"> Galp</label>
                        <label><input type="checkbox" value="PLENOIL" onchange="aplicarFiltros()"> Plenoil</label>
                        <label><input type="checkbox" value="PETROPRIX" onchange="aplicarFiltros()"> Petroprix</label>
                        <label><input type="checkbox" value="BP" onchange="aplicarFiltros()"> BP</label>
                        <label><input type="checkbox" value="SHELL" onchange="aplicarFiltros()"> Shell</label>
                        <label><input type="checkbox" value="BALLENOIL" onchange="aplicarFiltros()"> Ballenoil</label>
                    </div>
                </div>
            </div>
        </div>

        <div class="map-controls-group">
            <button class="btn-geo" onclick="localizarUsuario(true)" title="Centrar en mi ubicación">
                <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            </button>
            <div class="layers-dropdown-container">
                <button class="btn-layers" onclick="toggleCapasDropdown()" title="Cambiar tipo de mapa">
                    <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="12 2 2 7 2 12 12 17 22 12 22 7 12 2"/>
                        <polyline points="2 12 2 16 12 21 22 16 22 12"/>
                    </svg>
                </button>
                <div class="layers-dropdown" id="capasDropdown" style="display: none;">
                    <div class="layers-option" onclick="cambiarCapa('satelite')">
                        <input type="radio" name="mapLayer" id="layer-satelite" checked style="pointer-events: none;">
                        <label for="layer-satelite" style="pointer-events: none;">Satélite</label>
                    </div>
                    <div class="layers-option" onclick="cambiarCapa('calles')">
                        <input type="radio" name="mapLayer" id="layer-calles" style="pointer-events: none;">
                        <label for="layer-calles" style="pointer-events: none;">Callejero</label>
                    </div>
                    <div class="layers-option" onclick="cambiarCapa('oscuro')">
                        <input type="radio" name="mapLayer" id="layer-oscuro" style="pointer-events: none;">
                        <label for="layer-oscuro" style="pointer-events: none;">Modo Oscuro</label>
                    </div>
                    <div class="layers-option" onclick="cambiarCapa('claro')">
                        <input type="radio" name="mapLayer" id="layer-claro" style="pointer-events: none;">
                        <label for="layer-claro" style="pointer-events: none;">Modo Claro</label>
                    </div>
                    
                    <div style="border-top: 1px solid #e2e8f0; margin: 4px 0;"></div>
                    
                    <div class="layers-option" onclick="toggleWMS('limites')">
                        <input type="checkbox" id="layer-limites" style="pointer-events: none;">
                        <label style="pointer-events: none; font-weight: 600; color: #2563eb;">Límites Administrativos (WMS)</label>
                    </div>
                    <div class="layers-option" onclick="toggleWMS('zbe')">
                        <input type="checkbox" id="layer-zbe" style="pointer-events: none;">
                        <label style="pointer-events: none; font-weight: 600; color: #2563eb;">Zonas ZBE (GeoJSON)</label>
                    </div>
                </div>
            </div>
        </div>

        <div id="map"></div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/idb-keyval@6/dist/umd.js"></script>

    <script>
        // Utilidades UI
        function mostrarCarga(texto) {
            document.getElementById('textoCarga').textContent = texto;
            document.getElementById('pantallaCarga').style.display = 'flex';
        }

        function ocultarCarga() {
            document.getElementById('pantallaCarga').style.display = 'none';
        }

        // Recuperar orden favorita
        let ordenFavorita = null;
        const buzonStr = localStorage.getItem('orden_ir_a_gasolinera');
        if (buzonStr) {
            ordenFavorita = JSON.parse(buzonStr);
            localStorage.removeItem('orden_ir_a_gasolinera');
        }

        const startLat  = ordenFavorita ? ordenFavorita.lat  : 40.4168;
        const startLng  = ordenFavorita ? ordenFavorita.lng  : -3.7038;
        const startZoom = ordenFavorita ? 17 : 6; 

        // Capas base
        const mapaSatelite = L.tileLayer('https://mt1.google.com/vt/lyrs=s&hl=es&x={x}&y={y}&z={z}', { maxZoom: 20, attribution: '© Google' });
        const mapaCalles   = L.tileLayer('https://mt1.google.com/vt/lyrs=m&hl=es&x={x}&y={y}&z={z}', { maxZoom: 20, attribution: '© Google' });
        const mapaOscuro = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 20, attribution: '© CARTO' });
        const mapaClaro = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 20, attribution: '© CARTO' });

        const map = L.map('map', { zoomControl: false, layers: [mapaSatelite] }).setView([startLat, startLng], startZoom);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        const capasDisponibles = { satelite: mapaSatelite, calles: mapaCalles, oscuro: mapaOscuro, claro: mapaClaro };
        let capaActual = 'satelite';

        function toggleCapasDropdown() {
            const dd = document.getElementById('capasDropdown');
            dd.style.display = dd.style.display === 'none' ? 'flex' : 'none';
        }

        function cambiarCapa(nombre) {
            if (capaActual === nombre) { document.getElementById('capasDropdown').style.display = 'none'; return; }
            map.removeLayer(capasDisponibles[capaActual]);
            capasDisponibles[nombre].addTo(map);
            capaActual = nombre;
            document.getElementById('layer-satelite').checked = (nombre === 'satelite');
            document.getElementById('layer-calles').checked   = (nombre === 'calles');
            document.getElementById('layer-oscuro').checked   = (nombre === 'oscuro');
            document.getElementById('layer-claro').checked    = (nombre === 'claro');
            document.getElementById('capasDropdown').style.display = 'none';
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.layers-dropdown-container')) {
                document.getElementById('capasDropdown').style.display = 'none';
            }
        });

        // WMS Límites Administrativos (IGN)
        const capaLimites = L.tileLayer.wms('https://www.ign.es/wms-inspire/unidades-administrativas', {
            layers: 'AU.AdministrativeBoundary',
            format: 'image/png',
            transparent: true,
            opacity: 1,
            attribution: '© IGN'
        });

        // GeoJSON ZBE con carga controlada
        const estiloZBE = { color: "#ef4444", weight: 1, fillColor: "#ef4444", fillOpacity: 0.3 };
        let capaZBE = null;
        
        const promesaZBE = fetch('zbe.geojson')
            .then(res => res.json())
            .then(data => { capaZBE = L.geoJSON(data, { style: estiloZBE }); })
            .catch(err => console.error("Error cargando ZBE", err));

        window.toggleWMS = async function(tipoCapa) {
            const checkbox = document.getElementById(`layer-${tipoCapa}`);
            checkbox.checked = !checkbox.checked; 

            if (tipoCapa === 'zbe') {
                if (!capaZBE) {
                    mostrarCarga("Cargando Zonas de Bajas Emisiones...");
                    await promesaZBE;
                    ocultarCarga();
                }
                if (checkbox.checked && capaZBE) capaZBE.addTo(map);
                else if (capaZBE) map.removeLayer(capaZBE);
            } else if (tipoCapa === 'limites') {
                if (checkbox.checked) capaLimites.addTo(map);
                else map.removeLayer(capaLimites);
            }
            document.getElementById('capasDropdown').style.display = 'none';
        };

        // Variables globales y protección de Popup
        let marcadorUbicacionUsuario;
        let marcadorBusqueda = null;
        let todasLasEstaciones       = [];
        let capaPinesVisibles        = L.layerGroup().addTo(map);
        let puntoReferenciaDistancia = null;
        
        window.idPopupForzado        = ordenFavorita ? ordenFavorita.id : null;
        window.isRefreshingMap       = false; 
        
        window.misFavoritosIds       = [];
        window.usuarioLogueado       = false;

        window._calcularRuta = null;
        window._limpiarRuta  = null;

        let rutaActiva  = false;
        let origenRuta  = null;
        let destinoRuta = null;
        let ultimaRutaGeoJSON = null; 
        window.paradasSeleccionadas = []; 
        window.isRutaMinimizada = false;

        const brandLogos = {
            "REPSOL": "Repsol.png", "CEPSA": "Cepsa.png", "MOEVE": "Moeve.png",
            "GALP": "Galp.png", "PLENOIL": "Plenoil.png", "PETROPRIX": "Petroprix.png",
            "BP": "BP.png", "SHELL": "Shell.png", "BALLENOIL": "Ballenoil.png", "DEFAULT": "Default.png"
        };

        function obtenerLogo(rotulo) {
            if (!rotulo) return brandLogos["DEFAULT"];
            const r = rotulo.toUpperCase();
            for (const m in brandLogos) {
                if (m !== "DEFAULT" && r.includes(m)) return brandLogos[m];
            }
            return brandLogos["DEFAULT"];
        }

        // Filtros
        function toggleFiltros() {
            const p = document.getElementById('panelFiltros');
            p.style.display = p.style.display === 'none' ? 'flex' : 'none';
        }

        function aplicarFiltros() {
            document.getElementById('priceLabel').innerText = document.getElementById('filterPrice').value + ' €/L';
            const dv = document.getElementById('filterDistance').value;
            document.getElementById('distanceLabel').innerText = dv == 0 ? 'Cualquiera' : dv + ' km';
            actualizarPinesVisibles();
        }

        // Renderizado de pines
        window.actualizarPinesVisibles = function() {
            if (todasLasEstaciones.length === 0 || rutaActiva) return; 

            capaPinesVisibles.clearLayers();

            const limites = map.getBounds();
            const maxP    = parseFloat(document.getElementById('filterPrice').value);
            const maxD    = parseInt(document.getElementById('filterDistance').value);
            const selB    = Array.from(document.querySelectorAll('.brand-grid input:checked')).map(c => c.value);

            const filtradas = todasLasEstaciones.filter(e => {
                const id = e['IDEESS'];
                if (id === window.idPopupForzado) return true; 

                const lat = parseFloat(e['Latitud'].replace(',', '.'));
                const lng = parseFloat(e['Longitud (WGS84)'].replace(',', '.'));
                const pos = L.latLng(lat, lng);

                if (!limites.contains(pos)) return false;
                if (parseFloat(e['Precio Gases licuados del petróleo'].replace(',', '.')) > maxP) return false;
                if (maxD > 0 && puntoReferenciaDistancia && (puntoReferenciaDistancia.distanceTo(pos) / 1000) > maxD) return false;
                if (selB.length > 0) {
                    const m = e['Rótulo'].toUpperCase();
                    if (!selB.some(b => (b === 'CEPSA' && (m.includes('CEPSA') || m.includes('MOEVE'))) || m.includes(b))) return false;
                }
                return true;
            });

            if (filtradas.length === 0) return;

            if (map.getZoom() < 9 && filtradas.length > 20) {
                mostrarPinesAgrupadosPorProvincia(filtradas);
            } else {
                mostrarPinesIndividuales(filtradas);
            }
        };

        function mostrarPinesIndividuales(filtradas) {
            const media = filtradas.reduce((a, b) => a + parseFloat(b['Precio Gases licuados del petróleo'].replace(',', '.')), 0) / filtradas.length;

            filtradas.forEach(e => {
                const id     = e['IDEESS'];
                const lat    = parseFloat(e['Latitud'].replace(',', '.'));
                const lng    = parseFloat(e['Longitud (WGS84)'].replace(',', '.'));
                const precio = parseFloat(e['Precio Gases licuados del petróleo'].replace(',', '.'));
                const esFav  = window.misFavoritosIds.includes(id);

                const paradaIndex = window.paradasSeleccionadas.findIndex(p => p.id === id);
                const esParada = paradaIndex >= 0;
                const stopBadgeHTML = esParada ? `<span class="stop-badge">${paradaIndex + 1}</span>` : '';

                let color = 'pin-amarillo';
                if (precio <= media - 0.015) color = 'pin-verde';
                else if (precio >= media + 0.015) color = 'pin-rojo';

                const starIcon = esFav ? `<span class="pin-fav-indicator">★</span>` : '';
                const pinHtml  = `<div class="custom-price-pin ${color}${esParada ? ' selected-stop' : ''}">${stopBadgeHTML}${starIcon}<img src="${obtenerLogo(e['Rótulo'])}" class="pin-mini-logo"><span>${precio.toFixed(3)}€</span></div>`;

                let calculadorHTML = window.usuarioLogueado ? `
                    <div id="calc-container-${id}" style="margin-bottom:10px;">
                        <button style="width:100%;background:#2563eb;color:white;border:none;padding:6px;border-radius:4px;cursor:pointer;font-weight:600;" onclick="window.calcularCosteLlenado('${id}',${precio})">Calcular Depósito</button>
                        <div id="res-calc-${id}" style="display:none;margin-top:5px;font-size:12px;text-align:center;font-weight:bold;color:#1e293b;"></div>
                    </div>` : '';

                const rotulo    = e['Rótulo'].replace(/'/g, "\\'");
                const direccion = e['Dirección'].replace(/'/g, "\\'");
                const localidad = e['Localidad'].replace(/'/g, "\\'");

                let botonParadaHTML = '';
                if (rutaActiva) {
                    const btnParadaStyle = esParada ? "background:#fef2f2; color:#ef4444; border: 1px solid #fecaca;" : "background:#f0fdf4; color:#16a34a; border: 1px solid #bbf7d0;";
                    botonParadaHTML = `<button id="btn-parada-${id}" onclick="window.toggleParada('${id}', ${lat}, ${lng}, '${rotulo}')" style="width:100%; margin-bottom:10px; padding:8px; border-radius:6px; font-weight:bold; cursor:pointer; transition: all 0.2s; ${btnParadaStyle}">${esParada ? "Quitar parada" : "Añadir a la ruta"}</button>`;
                }

                const popup = `
                    <div class="popup-header">
                        <h3>${e['Rótulo']}</h3>
                        <span class="star-btn ${esFav ? 'active' : ''}" id="star-${id}" onclick="window.gestionarFavorito('${id}','${rotulo}',${lat},${lng},'${direccion}','${localidad}','${precio}')">★</span>
                    </div>
                    <p class="popup-address">${e['Dirección']}, ${e['Localidad']}</p>
                    <div style="margin:10px 0;padding:8px;background:#f0fdf4;border-radius:6px;text-align:center;"><span style="font-weight:bold;color:#16a34a;font-size:16px;">${precio.toFixed(3)} €/L</span></div>
                    ${calculadorHTML}${botonParadaHTML} 
                    <div class="nav-buttons">
                        <a href="https://waze.com/ul?ll=${lat},${lng}&navigate=yes" target="_blank" class="btn-nav btn-waze">Waze</a>
                        <a href="https://www.google.com/maps/search/?api=1&query=$${lat},${lng}" target="_blank" class="btn-nav btn-gmaps">Google Maps</a>
                    </div>`;

                const zIndexBase = esParada ? 500 : 0;
                const marcador = L.marker([lat, lng], {
                    icon: L.divIcon({ className: 'custom-div-icon', html: pinHtml, iconSize: [75, 28], iconAnchor: [37.5, 14], popupAnchor: [0, -15] }),
                    zIndexOffset: zIndexBase
                }).bindPopup(popup, { autoPan: false }).addTo(capaPinesVisibles);

                marcador.on('mouseover', function() { this.setZIndexOffset(1000); });
                marcador.on('mouseout', function() { this.setZIndexOffset(zIndexBase); });
                
                marcador.on('popupopen',  () => { window.idPopupForzado = id; });
                marcador.on('popupclose', () => { 
                    if (window.idPopupForzado === id && !window.isRefreshingMap) {
                        window.idPopupForzado = null; 
                    }
                });

                if (window.idPopupForzado === id) setTimeout(() => marcador.openPopup(), 50);
            });
        }

        function mostrarPinesAgrupadosPorProvincia(estaciones) {
            const capitalesProvincias = {
                'Álava': [42.85,-2.67], 'Albacete': [38.99,-1.86], 'Alicante': [38.34,-0.48], 'Almería': [36.83,-2.46], 'Ávila': [40.65,-4.69], 'Badajoz': [38.87,-6.97], 'Baleares': [39.57,2.65], 'Barcelona': [41.38,2.17], 'Burgos': [42.34,-3.69], 'Cáceres': [39.47,-6.37], 'Cádiz': [36.52,-6.29], 'Cantabria': [43.46,-3.80], 'Castellón': [39.98,-0.03], 'Ciudad Real': [38.98,-3.92], 'Córdoba': [37.88,-4.77], 'Coruña': [43.37,-8.39], 'Cuenca': [40.07,-2.13], 'Gerona': [41.98,2.82], 'Granada': [37.17,-3.59], 'Guadalajara': [40.63,-3.16], 'Guipúzcoa': [43.31,-1.97], 'Huelva': [37.25,-6.95], 'Huesca': [42.14,-0.40], 'Jaén': [37.76,-3.79], 'León': [42.60,-5.57], 'Lérida': [41.61,0.62], 'La Rioja': [42.46,-2.44], 'Lugo': [43.01,-7.55], 'Madrid': [40.41,-3.70], 'Málaga': [36.71,-4.42], 'Murcia': [37.98,-1.13], 'Navarra': [42.81,-1.65], 'Orense': [42.33,-7.86], 'Asturias': [43.36,-5.85], 'Palencia': [42.01,-4.53], 'Las Palmas': [28.12,-15.43], 'Pontevedra': [42.43,-8.64], 'Salamanca': [40.96,-5.66], 'Santa Cruz de Tenerife': [28.46,-16.25], 'Segovia': [40.94,-4.11], 'Sevilla': [37.38,-5.98], 'Soria': [41.76,-2.46], 'Tarragona': [41.11,1.24], 'Teruel': [40.34,-1.10], 'Toledo': [39.86,-4.02], 'Valencia': [39.46,-0.37], 'Valladolid': [41.65,-4.71], 'Vizcaya': [43.26,-2.92], 'Zamora': [41.50,-5.75], 'Zaragoza': [41.65,-0.88], 'Ceuta': [35.89,-5.32], 'Melilla': [35.29,-2.94]
            };

            const normalizarProvincia = (raw) => {
                const t = { 'ALAVA':'Álava','ÁLAVA':'Álava','ARABA':'Álava', 'ALBACETE':'Albacete','ALICANTE':'Alicante','ALACANT':'Alicante', 'ALMERIA':'Almería','ALMERÍA':'Almería','AVILA':'Ávila','ÁVILA':'Ávila', 'BADAJOZ':'Badajoz','BALEARES':'Baleares','ILLES BALEARS':'Baleares', 'BARCELONA':'Barcelona','BURGOS':'Burgos','CACERES':'Cáceres','CÁCERES':'Cáceres', 'CADIZ':'Cádiz','CÁDIZ':'Cádiz','CANTABRIA':'Cantabria', 'CASTELLON':'Castellón','CASTELLÓN':'Castellón','CASTELLO':'Castellón', 'CIUDAD REAL':'Ciudad Real','CORDOBA':'Córdoba','CÓRDOBA':'Córdoba', 'CORUÑA':'Coruña','A CORUÑA':'Coruña','LA CORUÑA':'Coruña', 'CUENCA':'Cuenca','GERONA':'Gerona','GIRONA':'Gerona', 'GRANADA':'Granada','GUADALAJARA':'Guadalajara', 'GUIPUZCOA':'Guipúzcoa','GUIPÚZCOA':'Guipúzcoa','GIPUZKOA':'Guipúzcoa', 'HUELVA':'Huelva','HUESCA':'Huesca','JAEN':'Jaén','JAÉN':'Jaén', 'LEON':'León','LEÓN':'León','LERIDA':'Lérida','LÉRIDA':'Lérida','LLEIDA':'Lérida', 'LA RIOJA':'La Rioja','RIOJA':'La Rioja','LUGO':'Lugo', 'MADRID':'Madrid','MALAGA':'Málaga','MÁLAGA':'Málaga', 'MURCIA':'Murcia','NAVARRA':'Navarra','NAFARROA':'Navarra', 'ORENSE':'Orense','OURENSE':'Orense','PALENCIA':'Palencia', 'LAS PALMAS':'Las Palmas','PALMAS':'Las Palmas','PONTEVEDRA':'Pontevedra', 'SALAMANCA':'Salamanca', 'SANTA CRUZ DE TENERIFE':'Santa Cruz de Tenerife','TENERIFE':'Santa Cruz de Tenerife', 'SEGOVIA':'Segovia','SEVILLA':'Sevilla','SORIA':'Soria', 'TARRAGONA':'Tarragona','TERUEL':'Teruel','TOLEDO':'Toledo', 'VALENCIA':'Valencia','VALÈNCIA':'Valencia', 'VALLADOLID':'Valladolid','VIZCAYA':'Vizcaya','BIZKAIA':'Vizcaya', 'ZAMORA':'Zamora','ZARAGOZA':'Zaragoza', 'CEUTA':'Ceuta','MELILLA':'Melilla','ASTURIAS':'Asturias' };
                return t[(raw || '').trim().toUpperCase()] || null;
            };

            const mapaCP = { '01':'Álava','02':'Albacete','03':'Alicante','04':'Almería','05':'Ávila', '06':'Badajoz','07':'Baleares','08':'Barcelona','09':'Burgos','10':'Cáceres', '11':'Cádiz','12':'Castellón','13':'Ciudad Real','14':'Córdoba','15':'Coruña', '16':'Cuenca','17':'Gerona','18':'Granada','19':'Guadalajara','20':'Guipúzcoa', '21':'Huelva','22':'Huesca','23':'Jaén','24':'León','25':'Lérida', '26':'La Rioja','27':'Lugo','28':'Madrid','29':'Málaga','30':'Murcia', '31':'Navarra','32':'Orense','33':'Asturias','34':'Palencia','35':'Las Palmas', '36':'Pontevedra','37':'Salamanca','38':'Santa Cruz de Tenerife','39':'Cantabria', '40':'Segovia','41':'Sevilla','42':'Soria','43':'Tarragona','44':'Teruel', '45':'Toledo','46':'Valencia','47':'Valladolid','48':'Vizcaya','49':'Zamora', '50':'Zaragoza','51':'Ceuta','52':'Melilla' };

            const clusters = {};
            estaciones.forEach(est => {
                let prov = normalizarProvincia(est['Provincia']) || mapaCP[(est['C.P.'] || est['Código Postal'] || '').trim().padStart(5, '0').substring(0, 2)] || 'Desconocida';
                if (!clusters[prov]) clusters[prov] = [];
                clusters[prov].push(est);
            });

            const clustersDatos = [];
            let sumaTotalVisible = 0;

            Object.entries(clusters).forEach(([prov, lista]) => {
                const coords = capitalesProvincias[prov];
                if (!coords) return;
                const mediaProv = lista.reduce((sum, e) => sum + parseFloat(e['Precio Gases licuados del petróleo'].replace(',', '.')), 0) / lista.length;
                clustersDatos.push({ prov, lista, coords, mediaProv });
                sumaTotalVisible += mediaProv;
            });

            const mediaPantalla = clustersDatos.length > 0 ? sumaTotalVisible / clustersDatos.length : 0;

            clustersDatos.forEach(c => {
                if (c.lista.length === 1) { mostrarPinesIndividuales(c.lista); return; }

                let colorClass = c.mediaProv <= mediaPantalla - 0.015 ? 'pin-verde' : (c.mediaProv >= mediaPantalla + 0.015 ? 'pin-rojo' : 'pin-amarillo');

                const clusterIcon = L.divIcon({
                    className: 'custom-div-icon',
                    html: `<div class="custom-price-pin ${colorClass}" style="flex-direction: column; height: auto; padding: 6px 12px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);"><span style="font-size: 15px; font-weight: bold;">${c.mediaProv.toFixed(3)}€</span><span style="font-size: 11px; font-weight: normal; opacity: 0.9;">${c.prov}</span></div>`,
                    iconSize: [80, 50], iconAnchor: [40, 25], popupAnchor: [0, -25]
                });

                L.marker(c.coords, { icon: clusterIcon, riseOnHover: true })
                    .bindPopup(`<div class="cluster-popup-simple"><h4>Media en ${c.prov}: ${c.mediaProv.toFixed(3)}€</h4><p>${c.lista.length} gasolineras. Haz clic para acercarte.</p></div>`)
                    .on('click', () => map.flyTo(c.coords, 10, { duration: 1 }))
                    .addTo(capaPinesVisibles);
            });
        }

        map.on('moveend', window.actualizarPinesVisibles);
        map.on('zoomend', window.actualizarPinesVisibles);

        // API Gasolineras (Actualizada a IndexedDB)
        async function cargarGasolineras() {
            const TIEMPO_EXPIRACION = 8 * 60 * 60 * 1000; 
            const ahora = Date.now();
            
            // Usamos idbKeyval para obtener el timestamp y los datos de la caché
            const ultimoTimestamp = await idbKeyval.get('glp_timestamp') || 0;
            const datosGuardados = await idbKeyval.get('glp_datos');

            // Si hay datos en IndexedDB, los cargamos directamente sin usar JSON.parse
            if (datosGuardados) { 
                todasLasEstaciones = datosGuardados; 
                window.actualizarPinesVisibles(); 
            }

            if ((ahora - ultimoTimestamp) > TIEMPO_EXPIRACION || todasLasEstaciones.length === 0) {
                try {
                    mostrarCarga("Descargando precios actualizados...");
                    const res = await fetch('https://obtenergasolineras-5qxjrxfuga-ew.a.run.app');
                    if (res.ok) {
                        const d = await res.json();
                        todasLasEstaciones = d.ListaEESSPrecio;
                        
                        // Guardamos el array nativo directamente en IndexedDB (no requiere JSON.stringify)
                        await idbKeyval.set('glp_datos', todasLasEstaciones);
                        await idbKeyval.set('glp_timestamp', ahora);
                        
                        window.actualizarPinesVisibles();
                    }
                } catch (e) {
                    console.warn("Fallo al actualizar datos:", e);
                }
            }
            ocultarCarga();
            if (!ordenFavorita) localizarUsuario(true);
        }

        // GPS
        function localizarUsuario(moverCamara = true) {
            mostrarCarga("Buscando tu ubicación GPS...");
            navigator.geolocation.getCurrentPosition(p => {
                puntoReferenciaDistancia = L.latLng(p.coords.latitude, p.coords.longitude);
                document.getElementById('routeOriginInput').placeholder = 'Ubicación actual';
                if (marcadorUbicacionUsuario) map.removeLayer(marcadorUbicacionUsuario);
                marcadorUbicacionUsuario = L.circleMarker([p.coords.latitude, p.coords.longitude], { radius: 8, fillColor: "#2563eb", color: "#fff", weight: 3, fillOpacity: 0.9 }).addTo(map);
                if (moverCamara) map.flyTo([p.coords.latitude, p.coords.longitude], 13);
                else window.actualizarPinesVisibles();
                ocultarCarga();
            }, () => {
                puntoReferenciaDistancia = null;
                document.getElementById('routeOriginInput').placeholder = 'Escribe un origen...';
                window.actualizarPinesVisibles();
                ocultarCarga();
            });
        }

        // Buscador Nominatim
        let tempBusq, abortCtrlDestino = null, tempBusqOrigen, abortCtrlOrigen = null;

        async function _nominatimFetch(query, ctrl) {
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=es&limit=5`, { signal: ctrl.signal });
            if (res.status === 429) throw Object.assign(new Error('429'), { is429: true });
            return res.json();
        }

        function _renderResultados(listaEl, data, onSelect) {
            listaEl.innerHTML = '';
            if (data.length > 0) data.forEach(i => { const li = document.createElement('li'); li.textContent = i.display_name; li.onclick = () => onSelect(i); listaEl.appendChild(li); });
            else listaEl.innerHTML = '<li style="color:#64748b;font-size:12px;padding:8px;">Sin resultados</li>';
            listaEl.style.display = 'block';
        }

        function manejarEntrada() {
            const q = document.getElementById('searchInput').value.trim();
            const resC = document.getElementById('searchResults');
            clearTimeout(tempBusq);
            if (q.length < 3) return resC.style.display = 'none';
            tempBusq = setTimeout(async () => {
                if (abortCtrlDestino) abortCtrlDestino.abort();
                abortCtrlDestino = new AbortController();
                try {
                    const data = await _nominatimFetch(q, abortCtrlDestino);
                    _renderResultados(resC, data, (i) => {
                        puntoReferenciaDistancia = L.latLng(parseFloat(i.lat), parseFloat(i.lon));
                        map.flyTo([i.lat, i.lon], 14);
                        document.getElementById('searchInput').value = i.display_name.split(',')[0];
                        resC.style.display = 'none';
                        if (marcadorBusqueda) map.removeLayer(marcadorBusqueda);
                        marcadorBusqueda = L.circleMarker([parseFloat(i.lat), parseFloat(i.lon)], { radius: 8, fillColor: "#2563eb", color: "#ffffff", weight: 3, fillOpacity: 0.9 }).addTo(map).bindPopup(`<b>${i.display_name.split(',')[0]}</b><br>Destino seleccionado`).openPopup();
                        actualizarPanelRuta(i.display_name.split(',')[0], parseFloat(i.lat), parseFloat(i.lon));
                        window.actualizarPinesVisibles();
                    });
                } catch (err) {
                    if (err.name !== 'AbortError') { resC.innerHTML = `<li style="color:#ef4444;font-size:12px;padding:8px;">${err.is429 ? 'Demasiadas peticiones' : 'Error de conexión'}</li>`; resC.style.display = 'block'; }
                }
            }, 400);
        }

        function buscarUbicacion() {
            if (document.getElementById('searchInput').value.trim().length >= 3) { clearTimeout(tempBusq); manejarEntrada(); }
        }

        function manejarEntradaOrigen() {
            const q = document.getElementById('routeOriginInput').value.trim();
            const resC = document.getElementById('originResults');
            clearTimeout(tempBusqOrigen);
            if (q.length === 0) { origenRuta = null; return resC.style.display = 'none'; }
            if (q.length < 3) return resC.style.display = 'none';
            tempBusqOrigen = setTimeout(async () => {
                if (abortCtrlOrigen) abortCtrlOrigen.abort();
                abortCtrlOrigen = new AbortController();
                try {
                    const data = await _nominatimFetch(q, abortCtrlOrigen);
                    _renderResultados(resC, data, (i) => {
                        document.getElementById('routeOriginInput').value = i.display_name.split(',')[0];
                        resC.style.display = 'none';
                        origenRuta = L.latLng(parseFloat(i.lat), parseFloat(i.lon));
                    });
                } catch (err) {
                    if (err.name !== 'AbortError') { resC.innerHTML = `<li style="color:#ef4444;font-size:12px;padding:8px;">${err.is429 ? 'Demasiadas peticiones' : 'Error de conexión'}</li>`; resC.style.display = 'block'; }
                }
            }, 400);
        }

        function buscarOrigen() {
            if (document.getElementById('routeOriginInput').value.trim().length >= 3) { clearTimeout(tempBusqOrigen); manejarEntradaOrigen(); }
        }

        map.on('click', () => { document.getElementById('searchResults').style.display = 'none'; document.getElementById('originResults').style.display = 'none'; });

        // Rutas y OSRM
        function actualizarPanelRuta(nombreDestino, lat, lng) {
            destinoRuta = L.latLng(lat, lng);
            document.getElementById('routeDestinationLabel').textContent = nombreDestino || 'Destino seleccionado';
            document.getElementById('routePanel').classList.remove('hidden');
            document.getElementById('routeDetailsFields').style.display = 'none';
            document.getElementById('btnProgramarRuta').style.display = 'block';
            document.getElementById('btnMinimizarRuta').style.display = 'none';
            document.getElementById('btnRutaGoogleMaps').style.display = 'none';
            window.isRutaMinimizada = false;
        }

        window.mostrarDetallesRuta = function() {
            document.getElementById('routeDetailsFields').classList.remove('hidden');
            document.getElementById('routeDetailsFields').style.display = 'block';
            document.getElementById('btnProgramarRuta').style.display = 'none';
            if (rutaActiva) {
                document.getElementById('btnMinimizarRuta').style.display = 'flex';
                document.getElementById('btnMinimizarRuta').textContent = '-';
                window.isRutaMinimizada = false;
            }
        };

        window.toggleMinimizarRuta = function() {
            window.isRutaMinimizada = !window.isRutaMinimizada;
            document.getElementById('routeDetailsFields').style.display = window.isRutaMinimizada ? 'none' : 'block';
            document.getElementById('btnMinimizarRuta').textContent = window.isRutaMinimizada ? '+' : '-';
        };

        function cerrarPanelRuta() {
            document.getElementById('routePanel').classList.add('hidden');
            document.getElementById('routeOriginInput').value = '';
            document.getElementById('originResults').style.display = 'none';
            document.getElementById('btnMinimizarRuta').style.display = 'none';
            document.getElementById('btnRutaGoogleMaps').style.display = 'none';
            document.getElementById('routeMessage').style.display = 'none';
            if (marcadorBusqueda) { map.removeLayer(marcadorBusqueda); marcadorBusqueda = null; }
            desactivarModoRuta();
        }

        function activarModoRuta() {
            rutaActiva = true;
            capaPinesVisibles.clearLayers();
        }

        function desactivarModoRuta() {
            rutaActiva = false;
            origenRuta = null;
            destinoRuta = null;
            ultimaRutaGeoJSON = null;
            window.paradasSeleccionadas = [];
            actualizarPanelParadas();
            if (window._limpiarRuta) window._limpiarRuta();
            window.actualizarPinesVisibles();
        }

        function mostrarMensajeRuta(texto, tipo) {
            const c = { info: '#2563eb', success: '#16a34a', warning: '#d97706', error: '#dc2626' };
            const msg = document.getElementById('routeMessage');
            msg.textContent = texto; msg.style.color = c[tipo] || '#1e293b'; msg.style.fontWeight = '600'; msg.style.fontSize = '13px'; msg.style.display = 'block';
        }

        async function calcularRutaDesdePanel() {
            if (!destinoRuta) return mostrarMensajeRuta('Aviso: Busca primero un destino en el buscador', 'warning');
            let origen = origenRuta || (marcadorUbicacionUsuario ? marcadorUbicacionUsuario.getLatLng() : null);
            if (!origen) return mostrarMensajeRuta('Aviso: Activa el GPS o escribe un origen', 'warning');
            if (!window._calcularRuta) return mostrarMensajeRuta('Error: Módulo de rutas no cargado', 'error');

            mostrarCarga("Calculando mejor ruta...");
            activarModoRuta();

            try {
                const res = await window._calcularRuta(origen, destinoRuta);
                const km = (res.distance / 1000).toFixed(1);
                const min = Math.round(res.duration / 60);
                ultimaRutaGeoJSON = res.geometry;
                window.paradasSeleccionadas = [];
                actualizarPanelParadas();
                filtrarGasolinerasEnRuta(ultimaRutaGeoJSON);
                mostrarMensajeRuta(`OK: ${km} km · ${Math.floor(min / 60) > 0 ? `${Math.floor(min / 60)}h ` : ''}${min % 60}min`, 'success');
                document.getElementById('routeDetailsFields').style.display = 'none';
                window.isRutaMinimizada = true;
                document.getElementById('btnMinimizarRuta').style.display = 'flex';
                document.getElementById('btnMinimizarRuta').textContent = '+';
                document.getElementById('btnRutaGoogleMaps').style.display = 'block';
            } catch (err) {
                desactivarModoRuta();
                mostrarMensajeRuta('Error: No se pudo calcular la ruta', 'error');
            } finally {
                ocultarCarga();
            }
        }
        
        window.reaplicarFiltroRuta = function() { if (rutaActiva && ultimaRutaGeoJSON) filtrarGasolinerasEnRuta(ultimaRutaGeoJSON); };

        function filtrarGasolinerasEnRuta(rutaGeoJSON) {
            if (todasLasEstaciones.length === 0) return;
            const lineaRuta = turf.lineString(rutaGeoJSON.coordinates);
            const maxKm = parseFloat(document.getElementById('routeDesvioInput').value) || 5; 
            const enRuta = todasLasEstaciones.filter(e => turf.pointToLineDistance(turf.point([parseFloat(e['Longitud (WGS84)'].replace(',', '.')), parseFloat(e['Latitud'].replace(',', '.'))]), lineaRuta, { units: 'kilometers' }) <= maxKm);
            capaPinesVisibles.clearLayers();
            document.getElementById('routeMessage').style.display = 'none';
            if (enRuta.length > 0) {
                mostrarPinesIndividuales(enRuta);
                setTimeout(() => mostrarMensajeRuta(`OK: ${enRuta.length} gasolineras a menos de ${maxKm}km del trayecto`, 'success'), 1000); 
            } else setTimeout(() => mostrarMensajeRuta(`Aviso: No hay gasolineras a menos de ${maxKm}km.`, 'warning'), 1000);
        }

        window.toggleParada = function(id, lat, lng, nombre) {
            const idx = window.paradasSeleccionadas.findIndex(p => p.id === id);
            if (idx >= 0) window.paradasSeleccionadas.splice(idx, 1); else window.paradasSeleccionadas.push({id, lat, lng, nombre}); 
            actualizarPanelParadas();
            if (rutaActiva && ultimaRutaGeoJSON) filtrarGasolinerasEnRuta(ultimaRutaGeoJSON);
        };

        window.moverParadaArriba = function(idx) {
            if (idx <= 0) return;
            [window.paradasSeleccionadas[idx - 1], window.paradasSeleccionadas[idx]] = [window.paradasSeleccionadas[idx], window.paradasSeleccionadas[idx - 1]];
            actualizarPanelParadas();
            if (rutaActiva && ultimaRutaGeoJSON) filtrarGasolinerasEnRuta(ultimaRutaGeoJSON);
        };

        window.moverParadaAbajo = function(idx) {
            if (idx >= window.paradasSeleccionadas.length - 1) return;
            [window.paradasSeleccionadas[idx + 1], window.paradasSeleccionadas[idx]] = [window.paradasSeleccionadas[idx], window.paradasSeleccionadas[idx + 1]];
            actualizarPanelParadas();
            if (rutaActiva && ultimaRutaGeoJSON) filtrarGasolinerasEnRuta(ultimaRutaGeoJSON);
        };

        function actualizarPanelParadas() {
            const c = document.getElementById('routeStopsContainer');
            if (!rutaActiva) return c.style.display = 'none';
            c.style.display = 'block';
            document.getElementById('stopsCount').textContent = window.paradasSeleccionadas.length;
            const lista = document.getElementById('stopsList');
            lista.innerHTML = '';
            window.paradasSeleccionadas.forEach((p, idx) => {
                const li = document.createElement('li');
                li.style.cssText = "display:flex; align-items:center; padding: 4px 0; border-bottom: 1px dashed #e2e8f0; gap: 8px;";
                const btnArriba = idx > 0 ? `<button onclick="window.moverParadaArriba(${idx})" style="background:none; border:none; color:#475569; cursor:pointer; font-size:14px; padding:0; width:20px; height:16px;">▲</button>` : '<div style="width:20px;"></div>';
                const btnAbajo = idx < window.paradasSeleccionadas.length - 1 ? `<button onclick="window.moverParadaAbajo(${idx})" style="background:none; border:none; color:#475569; cursor:pointer; font-size:14px; padding:0; width:20px; height:16px;">▼</button>` : '<div style="width:20px;"></div>';
                li.innerHTML = `<div style="display:flex; flex-direction:column; gap:2px; width:20px; align-items:center;">${btnArriba}${btnAbajo}</div><span style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex: 1; font-weight:500;"><strong style="margin-right:6px;color:#2563eb;">${idx + 1}.</strong>${p.nombre}</span><button onclick="window.toggleParada('${p.id}', ${p.lat}, ${p.lng}, '${p.nombre}')" style="background:none; border:none; color:#ef4444; cursor:pointer; font-weight:bold; font-size:14px; flex-shrink:0;">X</button>`;
                lista.appendChild(li);
            });
            document.getElementById('btnRutaGoogleMaps').textContent = window.paradasSeleccionadas.length > 0 ? `Abrir en Google Maps (${window.paradasSeleccionadas.length} paradas)` : 'Abrir ruta en Google Maps';
        }

        window.abrirRutaEnGoogleMaps = function() {
            let origen = origenRuta || (marcadorUbicacionUsuario ? marcadorUbicacionUsuario.getLatLng() : null);
            if (!origen || !destinoRuta) return;
            const url = new URL('https://www.google.com/maps/dir/');
            url.searchParams.append('api', '1');
            url.searchParams.append('origin', `${origen.lat},${origen.lng}`);
            url.searchParams.append('destination', `${destinoRuta.lat},${destinoRuta.lng}`);
            url.searchParams.append('travelmode', 'driving');
            if (window.paradasSeleccionadas.length > 0) url.searchParams.append('waypoints', window.paradasSeleccionadas.map(p => `${p.lat},${p.lng}`).join('|'));
            window.open(url.toString(), '_blank');
        };

        mostrarCarga("Iniciando aplicación...");
        cargarGasolineras();
    </script>

    <script type="module">
        // Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, deleteDoc, collection, getDocs, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { initRouteModule, calcularRuta, limpiarRuta } from './routes.js';

        initRouteModule(map);
        window._calcularRuta = calcularRuta;
        window._limpiarRuta  = limpiarRuta;

        const firebaseConfig = { apiKey: "AIzaSyB_2thDoQUjLM34QYO8nmaDAB8HqQIxtIY", authDomain: "glpfinder.firebaseapp.com", projectId: "glpfinder", storageBucket: "glpfinder.firebasestorage.app", messagingSenderId: "173596798895", appId: "1:173596798895:web:d883035f89fa2c139fc95a" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let usuarioActual = null, configVehiculo = null;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                usuarioActual = user; window.usuarioLogueado = true;
                document.getElementById('nav-auth').style.display = 'none';
                document.getElementById('nav-profile').style.display = 'inline-block';
                const fSnap = await getDocs(collection(db, "users", user.uid, "favoritos"));
                window.misFavoritosIds = fSnap.docs.map(d => d.id);
                const vSnap = await getDoc(doc(db, "users", user.uid, "configuracion", "vehiculo"));
                if (vSnap.exists()) configVehiculo = vSnap.data();
            } else {
                usuarioActual = null; window.usuarioLogueado = false; window.misFavoritosIds = []; configVehiculo = null;
                document.getElementById('nav-auth').style.display = 'inline-block';
                document.getElementById('nav-profile').style.display = 'none';
            }
            window.actualizarPinesVisibles();
        });

        window.calcularCosteLlenado = (id, precioLitro) => {
            const resDiv = document.getElementById(`res-calc-${id}`);
            if (!usuarioActual) return;
            if (!configVehiculo || !configVehiculo.deposito) { resDiv.innerHTML = "Aviso: Configura tu depósito"; resDiv.style.display = 'block'; return; }
            resDiv.innerHTML = `Depósito ${configVehiculo.deposito}L: <span style="color:#2563eb;">${(configVehiculo.deposito * precioLitro).toFixed(2)}€</span>`;
            resDiv.style.display = 'block';
        };

        window.gestionarFavorito = async (id, nombre, lat, lng, direccion, localidad, precio) => {
            if (!usuarioActual) return (window.location.href = "auth.html");

            // 1. Optimistic UI: Cambio de color inmediato en la estrella
            const starBtn = document.getElementById(`star-${id}`);
            const esFav = window.misFavoritosIds.includes(id);
            
            if (esFav) {
                if (starBtn) starBtn.classList.remove('active');
                window.misFavoritosIds = window.misFavoritosIds.filter(i => i !== id);
            } else {
                if (starBtn) starBtn.classList.add('active');
                window.misFavoritosIds.push(id);
            }

            // 2. Repintamos el mapa activando la protección para que no se cierre el popup
            window.isRefreshingMap = true;
            window.idPopupForzado = id;
            if (typeof window.actualizarPinesVisibles === 'function') window.actualizarPinesVisibles();
            window.isRefreshingMap = false;

            // 3. Peticiones a Firebase en segundo plano sin interrumpir al usuario
            const ref = doc(db, "users", usuarioActual.uid, "favoritos", id);
            if (esFav) {
                await deleteDoc(ref);
            } else {
                await setDoc(ref, { nombre, lat, lng, direccion, localidad, precio });
                const hoy = new Date().toISOString().split('T')[0];
                await setDoc(doc(db, "historial_precios", id, "registros", hoy), { precio: parseFloat(String(precio).replace(',', '.')), fecha: hoy }, { merge: true });
            }
        };

        document.getElementById('btn-logout').onclick = (e) => { e.preventDefault(); signOut(auth).then(() => location.reload()); };
    </script>
</body>
</html>
