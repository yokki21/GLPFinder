<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GLPFinder - Mis Datos</title>
    <link rel="icon" type="image/png" href="LogoPequeño.png">
    <link rel="stylesheet" href="styles.css">
    <style>
        .profile-container { max-width: 800px; margin: 40px auto; padding: 0 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        .data-card { background: white; border-radius: 12px; padding: 25px; border: 1px solid var(--border-color); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .data-card h2 { margin-top: 0; font-size: 1.2rem; color: var(--primary-color); border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; margin-bottom: 20px; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; color: #475569; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; background: white; }
        
        .info-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 15px; }
        .info-row span:first-child { font-weight: 600; color: #64748b; }
        
        .stats-box { background: #f8fafc; padding: 15px; border-radius: 10px; border: 1px solid #e2e8f0; margin-top: 15px; }
        .stat-item { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .stat-icon { font-size: 20px; }
        
        .btn-save { background: var(--primary-color); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: 700; margin-top: 10px; transition: background 0.2s; }
        .btn-save:hover { background: #1d4ed8; }
        
        .full-width { grid-column: 1 / -1; }
        .price-badge { font-size: 11px; background: #e2e8f0; padding: 2px 6px; border-radius: 4px; margin-top: 4px; display: inline-block; color: #475569; }
    @media (max-width: 768px) {
    .profile-container { 
        grid-template-columns: 1fr; 
        padding: 15px; 
        margin: 20px auto; 
    }
    .form-group input, .form-group select { 
        font-size: 16px; 
        padding: 12px; 
    }
    .btn-save { 
        padding: 15px; 
        font-size: 16px; 
    }
}
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo"><img src="Logo.png" alt="Logo GLPFinder"></a>
        <div class="nav-links">
            <a href="index.html">Mapa</a>
            <a href="favoritas.html">Mis Favoritas</a>
        </div>
    </header>

    <main class="profile-container">
        <section class="data-card">
            <h2>Mi Perfil</h2>
            <div class="info-row"><span>Nombre:</span> <span id="txt-nombre">-</span></div>
            <div class="info-row"><span>Email:</span> <span id="txt-email">-</span></div>
            <div class="info-row"><span>Cuenta:</span> <span style="color: #16a34a; font-weight: bold;">Activa</span></div>
        </section>

        <section class="data-card">
            <h2>Mi Vehículo GLP</h2>
            <div class="form-group">
                <label>Capacidad Depósito (Litros):</label>
                <input type="number" id="inp-deposito" placeholder="Ej: 40">
            </div>
            <div class="form-group">
                <label>Consumo Medio (L/100km):</label>
                <input type="number" id="inp-consumo" placeholder="Ej: 8.5" step="0.1">
            </div>
            <button class="btn-save" onclick="guardarDatosVehiculo()">Actualizar Datos</button>
        </section>

        <section class="data-card full-width">
            <h2>Panel de Eficiencia</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div>
                    <div class="form-group">
                        <label>Km aproximados al mes:</label>
                        <input type="number" id="inp-km-mes" placeholder="Ej: 1200" oninput="recalcularAhorro()">
                    </div>
                    <div class="form-group">
                        <label>Combustible anterior:</label>
                        <select id="select-combustible" onchange="recalcularAhorro()">
                            <option value="gas95">Gasolina 95 (Media Nacional)</option>
                            <option value="diesel">Diésel (Media Nacional)</option>
                            <option value="manual">Personalizado</option>
                        </select>
                        <div id="wrapper-manual" style="display:none; margin-top:10px;">
                            <input type="number" id="inp-precio-manual" placeholder="Precio €/L" step="0.001" oninput="recalcularAhorro()">
                        </div>
                        <span id="label-media-actual" class="price-badge">Calculando media nacional...</span>
                    </div>
                </div>
                <div class="stats-box">
                    <div class="stat-item">
                        <span class="stat-icon"></span>
                        <div>
                            <small style="display:block; color:#64748b">Autonomía teórica</small>
                            <strong id="res-autonomia">0 km</strong>
                        </div>
                    </div>
                    <div class="stat-item" style="margin-top: 15px;">
                        <span class="stat-icon"></span>
                        <div>
                            <small style="display:block; color:#64748b">Ahorro mensual estimado</small>
                            <strong id="res-ahorro" style="color: #16a34a; font-size: 1.2rem;">0.00 €</strong>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB_2thDoQUjLM34QYO8nmaDAB8HqQIxtIY",
            authDomain: "glpfinder.firebaseapp.com",
            projectId: "glpfinder",
            storageBucket: "glpfinder.firebasestorage.app",
            messagingSenderId: "173596798895",
            appId: "1:173596798895:web:d883035f89fa2c139fc95a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let userUID = null;
        
        // Variables globales para las medias
        let mediaGas95 = 0;
        let mediaDiesel = 0;
        let mediaGLP = 0.94; // Valor por defecto si falla la carga

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                userUID = user.uid;
                document.getElementById('txt-nombre').innerText = user.displayName || "Usuario";
                document.getElementById('txt-email').innerText = user.email;
                await obtenerMediasNacionales();
                await cargarDatosFirestore();
            } else {
                window.location.href = "auth.html";
            }
        });

        async function obtenerMediasNacionales() {
            try {
                const res = await fetch('https://sedeaplicaciones.minetur.gob.es/ServiciosRESTCarburantes/PreciosCarburantes/EstacionesTerrestres/');
                const data = await res.json();
                const lista = data.ListaEESSPrecio;

                let suma95 = 0, count95 = 0;
                let sumaDiesel = 0, countDiesel = 0;
                let sumaGLP = 0, countGLP = 0;

                lista.forEach(e => {
                    if (e['Precio Gasolina 95 E5']) {
                        suma95 += parseFloat(e['Precio Gasolina 95 E5'].replace(',', '.'));
                        count95++;
                    }
                    if (e['Precio Gasoleo A']) {
                        sumaDiesel += parseFloat(e['Precio Gasoleo A'].replace(',', '.'));
                        countDiesel++;
                    }
                    if (e['Precio Gases licuados del petróleo']) {
                        sumaGLP += parseFloat(e['Precio Gases licuados del petróleo'].replace(',', '.'));
                        countGLP++;
                    }
                });

                mediaGas95 = suma95 / count95;
                mediaDiesel = sumaDiesel / countDiesel;
                mediaGLP = sumaGLP / countGLP;

                document.getElementById('label-media-actual').innerText = `Medias hoy: G95: ${mediaGas95.toFixed(3)}€ | Diésel: ${mediaDiesel.toFixed(3)}€`;
            } catch (e) {
                console.error("Error cargando medias:", e);
                mediaGas95 = 1.62; 
                mediaDiesel = 1.49;
                document.getElementById('label-media-actual').innerText = `Medias estimadas: G95: ${mediaGas95.toFixed(3)}€ | Diésel: ${mediaDiesel.toFixed(3)}€`;
            }
        }

        async function cargarDatosFirestore() {
            const snap = await getDoc(doc(db, "users", userUID, "configuracion", "vehiculo"));
            if (snap.exists()) {
                const d = snap.data();
                document.getElementById('inp-deposito').value = d.deposito || "";
                document.getElementById('inp-consumo').value = d.consumo || "";
                document.getElementById('inp-km-mes').value = d.kmMes || "";
                document.getElementById('select-combustible').value = d.tipoCombustible || "gas95";
                if (d.tipoCombustible === 'manual') {
                    document.getElementById('wrapper-manual').style.display = 'block';
                    document.getElementById('inp-precio-manual').value = d.precioManual || "";
                }
                recalcularAhorro();
            }
        }

        window.guardarDatosVehiculo = async () => {
            const tipo = document.getElementById('select-combustible').value;
            const datos = {
                deposito: parseFloat(document.getElementById('inp-deposito').value),
                consumo: parseFloat(document.getElementById('inp-consumo').value),
                kmMes: parseFloat(document.getElementById('inp-km-mes').value),
                tipoCombustible: tipo,
                precioManual: tipo === 'manual' ? parseFloat(document.getElementById('inp-precio-manual').value) : null
            };
            await setDoc(doc(db, "users", userUID, "configuracion", "vehiculo"), datos);
            recalcularAhorro();
            alert("¡Perfil actualizado!");
        };

        window.recalcularAhorro = () => {
            const dep = parseFloat(document.getElementById('inp-deposito').value) || 0;
            const cons = parseFloat(document.getElementById('inp-consumo').value) || 0;
            const kmMes = parseFloat(document.getElementById('inp-km-mes').value) || 0;
            const tipo = document.getElementById('select-combustible').value;

            // Mostrar/Ocultar campo manual
            document.getElementById('wrapper-manual').style.display = (tipo === 'manual') ? 'block' : 'none';

            // Determinar precio de referencia
            let precioRef = mediaGas95;
            if (tipo === 'diesel') precioRef = mediaDiesel;
            if (tipo === 'manual') precioRef = parseFloat(document.getElementById('inp-precio-manual').value) || 0;

            // Autonomía
            if (dep > 0 && cons > 0) {
                document.getElementById('res-autonomia').innerText = Math.round((dep / cons) * 100) + " km";
            }

            // Ahorro
            if (kmMes > 0 && precioRef > 0 && cons > 0) {
                const costeMensualGLP = (kmMes / 100) * cons * mediaGLP;
                // Estimamos que en gasolina/diésel el coche consumiría un 15% menos de litros por eficiencia térmica
                const costeMensualAnterior = (kmMes / 100) * (cons * 0.85) * precioRef;
                const ahorro = costeMensualAnterior - costeMensualGLP;
                document.getElementById('res-ahorro').innerText = (ahorro > 0 ? ahorro.toFixed(2) : "0.00") + " €";
            }
        };
    </script>
</body>
</html>
