<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceder - GLPFinder</title>
    
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo">
            <img src="img/logo.webp" width="183" height="100" alt="Logo GLPFinder">
        </a>
        <div class="nav-links">
            <a href="index.html">Mapa</a>
            <a href="favoritas.html">Mis favoritas</a>
            <a href="datos.html">Mi vehículo</a>
            <a href="contacto.html">Contacto</a>
        </div>
    </header>

    <main class="form-main auth-main">
        <h1 class="page-title">Accede o regístrate</h1>
        <p style="max-width:720px; margin:-10px auto 20px; color:#475569; text-align:center;">Con una cuenta tus favoritas y los datos de tu coche se guardan y los tienes en todos tus dispositivos. Lo que ya tengas guardado en este navegador se pasará a tu cuenta.</p>
        <p id="auth-msg" role="alert" style="display:none; max-width:720px; margin:0 auto 16px; padding:10px 14px; border-radius:8px; background:#fef2f2; color:#b91c1c; border:1px solid #fecaca; font-weight:600; text-align:center;"></p>
        
        <div class="card">
            <div class="form-column">
                <h2 class="section-title">Inicia Sesión</h2>
                <form id="login-form">
                    <div class="form-group">
                        <label for="login-email">Correo Electrónico</label>
                        <input type="email" id="login-email" placeholder="tu@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Contraseña</label>
                        <input type="password" id="login-password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" id="btn-login" class="btn-primary">Entrar</button>
                    <a href="#" id="btn-reset" style="display:block; margin-top:10px; font-size:13px; color:#2563eb;">¿Has olvidado la contraseña?</a>
                </form>

                <div class="auth-divider-text">— O —</div>

                <button id="btn-google" class="btn-google">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo">
                    Continuar con Google
                </button>
            </div>

            <div class="divider"></div>

            <div class="form-column">
                <h2 class="section-title">Crear Cuenta</h2>
                <form id="register-form">
                    <div class="form-group">
                        <label for="register-name">Nombre completo</label>
                        <input type="text" id="register-name" placeholder="Tu nombre" required>
                    </div>
                    <div class="form-group">
                        <label for="register-email">Correo Electrónico</label>
                        <input type="email" id="register-email" placeholder="tu@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="register-password">Contraseña (Mínimo 6 caracteres)</label>
                        <input type="password" id="register-password" placeholder="••••••••" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="register-password-confirm">Repetir Contraseña</label>
                        <input type="password" id="register-password-confirm" placeholder="••••••••" required minlength="6">
                    </div>
                    <button type="submit" id="btn-register" class="btn-secondary">Registrarse</button>
                </form>
            </div>
        </div>
    </main>

    <script type="module">
        import { auth } from './almacen.js?v=2';
        import { signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, GoogleAuthProvider, signInWithPopup, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

        const msg = document.getElementById('auth-msg');
        function mostrarError(texto) { msg.textContent = texto; msg.style.display = 'block'; msg.scrollIntoView({ behavior: 'smooth', block: 'center' }); }

        const mensajes = {
            'auth/invalid-credential': 'Correo o contraseña incorrectos.',
            'auth/wrong-password': 'Correo o contraseña incorrectos.',
            'auth/user-not-found': 'No hay ninguna cuenta con ese correo.',
            'auth/email-already-in-use': 'Ya existe una cuenta con ese correo. Inicia sesión.',
            'auth/invalid-email': 'El correo no es válido.',
            'auth/weak-password': 'La contraseña debe tener al menos 6 caracteres.',
            'auth/too-many-requests': 'Demasiados intentos. Espera unos minutos.',
            'auth/popup-closed-by-user': 'Has cerrado la ventana de Google antes de terminar.',
            'auth/unauthorized-domain': 'Este dominio no está autorizado en Firebase.',
            'auth/network-request-failed': 'Sin conexión. Revisa tu internet.'
        };
        const errorLegible = (e) => mensajes[e.code] || 'No se ha podido completar. Inténtalo de nuevo.';
        const irAlMapa = () => { window.location.href = 'index.html'; };

        document.getElementById('btn-google').addEventListener('click', async (e) => {
            e.preventDefault();
            try { await signInWithPopup(auth, new GoogleAuthProvider()); irAlMapa(); }
            catch (err) { console.error(err); mostrarError(errorLegible(err)); }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-password').value;
            try { await signInWithEmailAndPassword(auth, email, pass); irAlMapa(); }
            catch (err) { console.error(err); mostrarError(errorLegible(err)); }
        });

        document.getElementById('btn-reset').addEventListener('click', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            if (!email) return mostrarError('Escribe tu correo arriba y vuelve a pulsar "¿Has olvidado la contraseña?".');
            try {
                await sendPasswordResetEmail(auth, email);
                msg.style.background = '#f0fdf4'; msg.style.color = '#15803d'; msg.style.borderColor = '#bbf7d0';
                msg.textContent = 'Te hemos enviado un correo para cambiar la contraseña.'; msg.style.display = 'block';
            } catch (err) { console.error(err); mostrarError(errorLegible(err)); }
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('register-name').value.trim();
            const email = document.getElementById('register-email').value.trim();
            const pass = document.getElementById('register-password').value;
            const passConfirm = document.getElementById('register-password-confirm').value;
            if (pass !== passConfirm) return mostrarError('Las contraseñas no coinciden.');
            try {
                const { user } = await createUserWithEmailAndPassword(auth, email, pass);
                await updateProfile(user, { displayName: name });
                irAlMapa();
            } catch (err) { console.error(err); mostrarError(errorLegible(err)); }
        });
    </script>
</body>
</html>
