<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GLPFinder - Mis Favoritas</title>
    
    <link rel="icon" type="image/png" href="LogoPequeño.png">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <header>
        <a href="index.html" class="logo">
            <img src="Logo.png" alt="Logo GLPFinder">
        </a>
        <div class="nav-links">
            <a href="index.html">Mapa</a>
            <a href="datos.html">Mis datos</a>
        </div>
    </header>

    <main class="fav-main">
        <div class="fav-header">
            <h1>Mis gasolineras favoritas</h1>
        </div>

        <div id="fav-container" class="fav-grid">
            </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB_2thDoQUjLM34QYO8nmaDAB8HqQIxtIY",
            authDomain: "glpfinder.firebaseapp.com",
            projectId: "glpfinder",
            storageBucket: "glpfinder.firebasestorage.app",
            messagingSenderId: "173596798895",
            appId: "1:173596798895:web:d883035f89fa2c139fc95a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                cargarFavoritos(user.uid);
            } else {
                window.location.href = "auth.html";
            }
        });

        async function cargarFavoritos(uid) {
            const container = document.getElementById('fav-container');
            const snap = await getDocs(collection(db, "users", uid, "favoritos"));
            
            if (snap.empty) {
                container.innerHTML = `<div class="empty-state"><h3>Lista vacía</h3><p>Guarda gasolineras desde el mapa pulsando la estrella.</p></div>`;
                return;
            }

            container.innerHTML = ''; // Limpiar
            snap.forEach(docSnap => {
                const data = docSnap.data();
                const id = docSnap.id;
                
                const card = document.createElement('div');
                card.className = 'fav-card';
                card.id = `card-${id}`;
                card.innerHTML = `
                    <h3>${data.nombre}</h3>
                    <p>${data.direccion}, ${data.localidad}</p>
                    <div class="price-tag">Precio GLP: ${data.precio}€</div>
                    <canvas id="chart-${id}" style="height: 150px;"></canvas>
                    <button class="btn-secondary" onclick="eliminarFavorita('${id}')">Eliminar</button>
                `;
                container.appendChild(card);
                dibujarGrafica(id);
            });
        }

        async function dibujarGrafica(id) {
            const canvas = document.getElementById(`chart-${id}`);
            if (!canvas) return;
            
            try {
                const registros = await getDocs(query(collection(db, "historial_precios", id, "registros"), orderBy("fecha", "asc")));
                const labels = [];
                const precios = [];
                
                registros.forEach(r => {
                    labels.push(r.data().fecha);
                    precios.push(parseFloat(r.data().precio));
                });

                new Chart(canvas.getContext('2d'), {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Evolución Precio',
                            data: precios,
                            borderColor: '#2563eb',
                            tension: 0.3
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            } catch (e) {
                console.error("Error al pintar gráfica", e);
            }
        }

        window.eliminarFavorita = async (id) => {
            if (confirm("¿Seguro que quieres eliminar esta gasolinera?")) {
                await deleteDoc(doc(db, "users", auth.currentUser.uid, "favoritos", id));
                document.getElementById(`card-${id}`).remove();
            }
        };
    </script>
</body>
</html>
