<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0B4EA2">
    <title>Mis favoritas - GLPFinder</title>
    
    <link rel="icon" type="image/svg+xml" href="img/icono.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css?v=4">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

</head>
<body>

    <header>
        <a href="index.html" class="logo" aria-label="GLPFinder, ir al mapa">
            <img src="img/logo.svg" width="160" height="36" alt="GLPFinder">
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="menu-principal" aria-label="Abrir menú">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <nav class="nav-links" id="menu-principal" aria-label="Principal">
            <a href="index.html">Mapa</a>
            <a href="favoritas.html">Mis favoritas</a>
            <a href="datos.html">Mi vehículo</a>
            <a href="contacto.html">Contacto</a>
            <a href="auth.html" id="nav-auth">Acceder</a>
            <a href="#" id="nav-logout" hidden>Cerrar sesión</a>
        </nav>
    </header>

    <main class="fav-main">
        <div class="fav-header">
            <h1 class="page-title">Mis favoritas</h1>
            <p class="page-lead">Las gasolineras que guardas desde el mapa, con su precio de hoy y cómo ha cambiado.</p>
        </div>

        <div id="fav-container" class="fav-grid">
            <div class="empty-state" style="grid-column: 1 / -1;">
                <h3>Cargando favoritas...</h3>
            </div>
        </div>
    </main>

    <script type="module">
        import { leerFavoritas, quitarFavorita, leerVehiculo, leerHistorialAntiguo } from './almacen.js?v=2';

        let configVehiculo = null; // Datos del coche guardados en "Mi vehículo"
        leerVehiculo().then(v => { configVehiculo = v; }).catch(() => {});
        window.misGraficas = {}; 

        const brandLogos = {
            "REPSOL": "img/marcas/repsol.webp", "CEPSA": "img/marcas/cepsa.webp", "MOEVE": "img/marcas/moeve.webp", 
            "GALP": "img/marcas/galp.webp", "PLENOIL": "img/marcas/plenoil.webp", "PETROPRIX": "img/marcas/petroprix.webp",
            "BP": "img/marcas/bp.webp", "SHELL": "img/marcas/shell.webp", "BALLENOIL": "img/marcas/ballenoil.webp", "DEFAULT": "img/marcas/default.webp"
        };

        function obtenerLogo(rotulo) {
            const r = rotulo ? rotulo.toUpperCase() : "";
            for (const m in brandLogos) {
                if (r.includes(m) && m !== "DEFAULT") return brandLogos[m];
            }
            return brandLogos["DEFAULT"];
        }

        cargarYRenderizarFavoritas();

        // NUEVO: Función para calcular el llenado igual que en index.html
        window.calcularCosteLlenado = (id, precioLitro) => {
            const resDiv = document.getElementById(`res-calc-${id}`);
            if (!configVehiculo || !configVehiculo.deposito) {
                resDiv.innerHTML = " Configura tu depósito en 'Mi vehículo'";
                resDiv.style.display = 'block';
                return;
            }
            const total = configVehiculo.deposito * precioLitro;
            resDiv.innerHTML = `Llenar depósito (${configVehiculo.deposito}L): <span style="color:#0B4EA2;">${total.toFixed(2)}€</span>`;
            resDiv.style.display = 'block';
        };

        const escHTML = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        async function cargarYRenderizarFavoritas() {
            const container = document.getElementById('fav-container');
            try {
                const favoritas = Object.entries(await leerFavoritas());
                if (favoritas.length === 0) {
                    container.innerHTML = `<div class="empty-state" style="grid-column: 1 / -1;"><h3>Todavía no tienes favoritas</h3><p>Abre una gasolinera en el mapa y pulsa la estrella para guardarla aquí.</p></div>`;
                    return;
                }

                let preciosEnVivo = [];
                try {
                    const res = await fetch('data/gasolineras.json', { cache: 'no-cache' });
                    if (res.ok) preciosEnVivo = (await res.json()).ListaEESSPrecio;
                } catch (errPrecios) {
                    console.warn("No se pudieron cargar los precios actuales:", errPrecios);
                }

                container.innerHTML = '';
                favoritas.forEach(([idFav, data]) => {
                    const id = escHTML(idFav);
                    
                    let pActual = parseFloat(data.precio);
                    let latSegura = data.lat;
                    let lngSegura = data.lng;
                    
                    const fresco = preciosEnVivo.find(e => e['IDEESS'] === id);
                    if (fresco) {
                        if (fresco['Precio Gases licuados del petróleo']) {
                            pActual = parseFloat(fresco['Precio Gases licuados del petróleo'].replace(',', '.'));
                        }
                        if (latSegura === undefined || lngSegura === undefined || isNaN(latSegura)) {
                            latSegura = parseFloat(fresco['Latitud'].replace(',', '.'));
                            lngSegura = parseFloat(fresco['Longitud (WGS84)'].replace(',', '.'));
                        }
                    }

                    const card = document.createElement('div');
                    card.className = 'fav-card';
                    card.id = `card-${id}`;
                    card.innerHTML = `
                        <div class="fav-card-header">
                            <img src="${obtenerLogo(data.nombre)}" class="fav-logo" alt="">
                            <h3 class="fav-title">${escHTML(data.nombre)}</h3>
                        </div>
                        <span class="fav-price-tag">${pActual.toFixed(3)} €/L</span>
                        <p class="fav-address"> ${escHTML(data.direccion)}</p>
                        
                        <div id="calc-container-${id}" style="margin-bottom: 15px;">
                            <button style="width:100%; background:#E7EEF8; color:#0B4EA2; border:1px solid #C9D8EE; padding:8px; border-radius:6px; cursor:pointer; font-weight:600; font-size: 13px;"
                                onclick="window.calcularCosteLlenado('${id}', ${pActual})">Calcular coste de llenado</button>
                            <div id="res-calc-${id}" style="display:none; margin-top:5px; font-size:14px; text-align:center; font-weight:bold; color:#0F2236; padding:6px; background:#F1F4F8; border-radius:4px;"></div>
                        </div>
                        
                        <div id="chart-wrapper-${id}" class="chart-wrapper">
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                                <strong style="font-size:14px">Evolución del precio</strong>
                                <select onchange="window.cargarGraficaLineal('${id}', this.value)" style="font-size:11px; padding:3px; border-radius:4px;">
                                    <option value="7">Últimos 7 días</option>
                                    <option value="30">Último mes</option>
                                    <option value="90">3 meses</option>
                                </select>
                            </div>
                            <div class="chart-canvas-container">
                                <canvas id="canvas-${id}"></canvas>
                            </div>
                            <div id="msg-chart-${id}" style="text-align:center; font-size:11px; color:#C23B2E; margin-top:5px; display:none;"></div>
                        </div>

                        <div class="fav-actions">
                            <button class="btn-action btn-map" onclick="window.saltarAlMapa('${id}', ${latSegura}, ${lngSegura})">Ver en el mapa</button>
                            <button class="btn-action btn-chart-toggle" onclick="window.toggleGrafica('${id}')">Historial</button>
                            <button class="btn-action btn-remove" onclick="window.eliminarFavorita('${id}')" title="Quitar de favoritas" aria-label="Quitar de favoritas"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (e) { console.error(e); }
        }

        window.saltarAlMapa = (id, lat, lng) => {
            const orden = { id: id, lat: lat, lng: lng };
            localStorage.setItem('orden_ir_a_gasolinera', JSON.stringify(orden));
            window.location.href = "index.html"; 
        };

        window.toggleGrafica = (id) => {
            const wrapper = document.getElementById(`chart-wrapper-${id}`);
            const visible = wrapper.style.display === 'block';
            wrapper.style.display = visible ? 'none' : 'block';
            if (!visible) window.cargarGraficaLineal(id, 7);
        };

        window.cargarGraficaLineal = async (id, dias) => {
            const canvas = document.getElementById(`canvas-${id}`);
            const msgBox = document.getElementById(`msg-chart-${id}`);
            
            try {
                const n = parseInt(dias);
                const porFecha = new Map();

                // Registros antiguos guardados en Firestore (antes de la GitHub Action)
                (await leerHistorialAntiguo(id, n)).forEach(r => porFecha.set(r.fecha, r));

                // Historial actual generado por GitHub Actions (tiene prioridad si hay fechas repetidas)
                try {
                    const res = await fetch(`data/historial/${encodeURIComponent(id)}.json`, { cache: 'no-cache' });
                    if (res.ok) (await res.json()).forEach(r => porFecha.set(r.fecha, r));
                } catch (errJson) { console.warn("Historial estático no disponible:", errJson); }

                const datos = [...porFecha.values()].sort((a, b) => a.fecha.localeCompare(b.fecha)).slice(-n);

                if (datos.length === 0) { 
                    canvas.style.display = 'none';
                    msgBox.innerHTML = 'Sin datos en el historial';
                    msgBox.style.display = 'block';
                    return; 
                }

                canvas.style.display = 'block';
                msgBox.style.display = 'none';

                
                const fechas = datos.map(d => {
                    const partes = d.fecha.split('-');
                    return `${partes[2]}/${partes[1]}`; 
                });
                const precios = datos.map(d => d.precio);
                
                const minPrecio = Math.min(...precios);
                const maxPrecio = Math.max(...precios);

                if (window.misGraficas[id]) {
                    window.misGraficas[id].destroy();
                }

                window.misGraficas[id] = new Chart(canvas, {
                    type: 'line',
                    data: {
                        labels: fechas,
                        datasets: [{
                            label: 'Precio (€/L)',
                            data: precios,
                            borderColor: '#0B4EA2', 
                            backgroundColor: 'rgba(11, 78, 162, 0.10)', 
                            borderWidth: 2,
                            pointBackgroundColor: '#0B4EA2',
                            pointRadius: 3,
                            fill: true, 
                            tension: 0.3 
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false, 
                        plugins: {
                            legend: { display: false } 
                        },
                        scales: {
                            x: {
                                grid: { display: false },
                                ticks: { font: { size: 10 } }
                            },
                            y: {
                                min: minPrecio - 0.02,
                                max: maxPrecio + 0.02,
                                ticks: { font: { size: 10 }, stepSize: 0.02 }
                            }
                        }
                    }
                });

            } catch(e) {
                console.error("Error al pintar gráfica:", e);
                canvas.style.display = 'none';
                msgBox.innerHTML = 'Error al cargar datos';
                msgBox.style.display = 'block';
            }
        };

        window.eliminarFavorita = async (id) => {
            if (confirm("¿Estás seguro de que quieres eliminar esta gasolinera de tu lista?")) {
                await quitarFavorita(id);
                document.getElementById(`card-${id}`).remove();
                
                const container = document.getElementById('fav-container');
                if (container.children.length === 0) {
                    container.innerHTML = `<div class="empty-state" style="grid-column: 1 / -1;"><h3>Todavía no tienes favoritas</h3><p>Abre una gasolinera en el mapa y pulsa la estrella para guardarla aquí.</p></div>`;
                }
            }
        };

    </script>
    <script src="nav.js" defer></script>
</body>
</html>
