# Descarga los precios del Ministerio, genera public/data/*.json y publica la web en GitHub Pages.
name: Actualizar datos y desplegar

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */2 * * *"   # cada 2 horas: precios actuales
    - cron: "47 15 * * *"    # una vez al día: además guarda el historial en el repo
  workflow_dispatch:

concurrency:
  group: actualizar-y-desplegar
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Descargar precios y generar JSON
        run: node scripts/actualizar_datos.mjs

      - name: Guardar historial en el repositorio
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '47 15 * * *'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/data/historial
          if git diff --cached --quiet; then
            echo "Sin cambios en el historial"
          else
            git commit -m "Historial de precios $(TZ=Europe/Madrid date +%F)"
            git pull --rebase origin main
            git push
          fi

      - name: Descargar tipografías (Barlow, licencia SIL OFL)
        run: |
          mkdir -p public/fonts
          curl -fsSL -o public/fonts/barlow-400.woff2 https://fonts.gstatic.com/s/barlow/v13/7cHpv4kjgoGqM7E_DMs5.woff2
          curl -fsSL -o public/fonts/barlow-600.woff2 https://fonts.gstatic.com/s/barlow/v13/7cHqv4kjgoGqM7E30-8s51os.woff2
          curl -fsSL -o public/fonts/barlow-semi-condensed-700.woff2 https://fonts.gstatic.com/s/barlowsemicondensed/v16/wlpigxjLBV1hqnzfr-F8sEYMB0Yybp0mudRfw6-_B2sl.woff2

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v4
