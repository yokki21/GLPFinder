# Publicación manual del resumen en el canal de Telegram (respaldo).
# La publicación diaria la hace el Worker de Cloudflare a las 8:30 (bot/worker.js), que es puntual.
name: Publicar en Telegram (manual)

on:
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publicar resumen del día
        run: node scripts/publicar_telegram.mjs
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CANAL: ${{ secrets.TELEGRAM_CANAL }}
