<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLPFinder - Mapa</title>
    
    <link rel="icon" type="image/png" href="LogoPequeño.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

    <header>
        <a href="index.html" class="logo">
            <img src="Logo.png" alt="Logo GLPFinder">
        </a>
        <div class="nav-links">
            <a href="contacto.html">Contacto</a>
            
            <a href="auth.html" id="nav-auth">Acceder / Registro</a>
            
            <div class="profile-dropdown" id="nav-profile" style="display: none;">
                <button class="profile-btn">Perfil <span>▼</span></button>
                <div class="dropdown-content">
                    <a href="datos.html">Mis datos</a>
                    <a href="favoritas.html">Mis favoritas</a>
                    <a href="#" id="btn-logout" class="logout-option">Cerrar sesión</a>
                </div>
            </div>
        </div>
    </header>

    <main class="map-main">
        <div class="search-wrapper">
            <div class="search-container-box">
                <div class="search-controls">
                    <input type="text" id="searchInput" placeholder="Municipio, calle, CP..." oninput="manejarEntrada()" autocomplete="off">
                    <button onclick="buscarUbicacion()">Buscar</button>
                    <button class="btn-icon" onclick="toggleFiltros()" title="Filtrar resultados">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                        </svg>
                    </button>
                </div>
                <ul id="searchResults" class="search-results"></ul>
            </div>
            
            <div id="panelFiltros" class="filter-panel" style="display: none;">
                <h4>Filtros</h4>
                
                <div class="filter-group">
                    <label>Precio Máximo: <span id="priceLabel" class="filter-val">1.50 €/L</span></label>
                    <input type="range" id="filterPrice" min="0.50" max="1.50" step="0.01" value="1.50" oninput="aplicarFiltros()">
                </div>

                <div class="filter-group">
                    <label>Distancia Máxima: <span id="distanceLabel" class="filter-val">Cualquiera</span></label>
                    <input type="range" id="filterDistance" min="0" max="50" step="1" value="0" oninput="aplicarFiltros()">
                </div>

                <div class="filter-group">
                    <label>Marcas</label>
                    <div class="brand-grid">
                        <label><input type="checkbox" value="REPSOL" onchange="aplicarFiltros()"> Repsol</label>
                        <label><input type="checkbox" value="CEPSA" onchange="aplicarFiltros()"> Cepsa/Moeve</label>
                        <label><input type="checkbox" value="GALP" onchange="aplicarFiltros()"> Galp</label>
                        <label><input type="checkbox" value="PLENOIL" onchange="aplicarFiltros()"> Plenoil</label>
                        <label><input type="checkbox" value="PETROPRIX" onchange="aplicarFiltros()"> Petroprix</label>
                        <label><input type="checkbox" value="BP" onchange="aplicarFiltros()"> BP</label>
                        <label><input type="checkbox" value="SHELL" onchange="aplicarFiltros()"> Shell</label>
                        <label><input type="checkbox" value="BALLENOIL" onchange="aplicarFiltros()"> Ballenoil</label>
                    </div>
                </div>
            </div>
        </div>

        <button class="btn-geo" onclick="localizarUsuario()" title="Centrar en mi ubicación">
            <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
        </button>

        <div id="map"></div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // LÓGICA DE MAPA E INTERFAZ
        const map = L.map('map', { zoomControl: false }).setView([40.4168, -3.7038], 6);
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        L.tileLayer('https://mt1.google.com/vt/lyrs=s&hl=es&x={x}&y={y}&z={z}', { maxZoom: 20, attribution: '© Google' }).addTo(map);

        let marcadorUbicacionUsuario;
        let marcadorBusquedaDireccion;
        let todasLasEstaciones = [];
        let capaPinesVisibles = L.layerGroup().addTo(map);
        let puntoReferenciaDistancia = null; 
        let misFavoritosIds = []; 

        const FALLBACK_LOGO = "Default.png";
        const brandLogos = {
            "REPSOL": "Repsol.png",
            "CEPSA": "Cepsa.png",
            "MOEVE": "Moeve.png", 
            "GALP": "Galp.png",
            "PLENOIL": "Plenoil.png",
            "PETROPRIX": "Petroprix.png",
            "BP": "BP.png",
            "SHELL": "Shell.png",
            "BALLENOIL": "Ballenoil.png",
            "DEFAULT": FALLBACK_LOGO
        };

        function obtenerLogo(rotulo) {
            if (!rotulo) return brandLogos["DEFAULT"];
            const nombre = rotulo.toUpperCase();
            for (const marca in brandLogos) {
                if (nombre.includes(marca) && marca !== "DEFAULT") {
                    return brandLogos[marca];
                }
            }
            return brandLogos["DEFAULT"];
        }

        function toggleFiltros() {
            const panel = document.getElementById('panelFiltros');
            panel.style.display = panel.style.display === 'none' ? 'flex' : 'none';
        }

        function aplicarFiltros() {
            const priceVal = document.getElementById('filterPrice').value;
            document.getElementById('priceLabel').innerText = priceVal + ' €/L';
            const distVal = document.getElementById('filterDistance').value;
            document.getElementById('distanceLabel').innerText = distVal == 0 ? 'Cualquiera' : distVal + ' km';
            actualizarPinesVisibles();
        }

        function actualizarPinesVisibles() {
            if (todasLasEstaciones.length === 0) return;
            capaPinesVisibles.clearLayers();
            const limitesMapa = map.getBounds();
            const maxPrice = parseFloat(document.getElementById('filterPrice').value);
            const maxDist = parseInt(document.getElementById('filterDistance').value);
            const brandCheckboxes = document.querySelectorAll('.brand-grid input[type="checkbox"]:checked');
            const selectedBrands = Array.from(brandCheckboxes).map(cb => cb.value);

            const estacionesFiltradas = todasLasEstaciones.filter(estacion => {
                const lat = parseFloat(estacion['Latitud'].replace(',', '.'));
                const lng = parseFloat(estacion['Longitud (WGS84)'].replace(',', '.'));
                const stationLatLng = L.latLng(lat, lng);
                if (!limitesMapa.contains(stationLatLng)) return false;

                const precio = parseFloat(estacion['Precio Gases licuados del petróleo'].replace(',', '.'));
                const marca = estacion['Rótulo'].toUpperCase();
                if (precio > maxPrice) return false;

                if (maxDist > 0 && puntoReferenciaDistancia) {
                    const distKm = puntoReferenciaDistancia.distanceTo(stationLatLng) / 1000;
                    if (distKm > maxDist) return false;
                }

                if (selectedBrands.length > 0) {
                    let match = false;
                    for (let b of selectedBrands) {
                        if ((b === 'CEPSA' && (marca.includes('CEPSA') || marca.includes('MOEVE'))) || marca.includes(b)) {
                            match = true; break;
                        }
                    }
                    if (!match) return false;
                }
                return true;
            });

            if (estacionesFiltradas.length === 0) return;

            let sumaPrecios = 0;
            estacionesFiltradas.forEach(estacion => sumaPrecios += parseFloat(estacion['Precio Gases licuados del petróleo'].replace(',', '.')));
            const media = sumaPrecios / estacionesFiltradas.length;
            const margen = 0.015; 

            estacionesFiltradas.forEach(estacion => {
                const idUnico = estacion['IDEESS'];
                const lat = parseFloat(estacion['Latitud'].replace(',', '.'));
                const lng = parseFloat(estacion['Longitud (WGS84)'].replace(',', '.'));
                const marca = estacion['Rótulo'];
                const precio = parseFloat(estacion['Precio Gases licuados del petróleo'].replace(',', '.'));
                
                let claseColor = 'pin-amarillo';
                if (precio <= media - margen) claseColor = 'pin-verde';
                else if (precio >= media + margen) claseColor = 'pin-rojo';

                const esFavorita = misFavoritosIds.includes(idUnico);
                const starIndicator = esFavorita ? `<span class="pin-fav-indicator">★</span>` : '';

                const popupHTML = `
                    <div class="popup-header">
                        <h3>${marca}</h3>
                        <span class="star-btn ${esFavorita ? 'active' : ''}" 
                              id="star-${idUnico}" 
                              onclick="window.gestionarFavorito('${idUnico}', '${marca.replace(/'/g, "\\'")}', ${lat}, ${lng}, '${estacion['Dirección'].replace(/'/g, "\\'")}', '${estacion['Localidad'].replace(/'/g, "\\'")}', '${precio}')">★</span>
                    </div>
                    <div class="popup-address">${estacion['Dirección']}, ${estacion['Localidad']}</div>
                    <div class="nav-buttons">
                        <a href="https://waze.com/ul?ll=${lat},${lng}&navigate=yes" target="_blank" class="btn-nav btn-waze">Waze</a>
                        <a href="https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}" target="_blank" class="btn-nav btn-gmaps">Maps</a>
                    </div>`;
                
                const priceIcon = L.divIcon({
                    className: 'custom-div-icon',
                    html: `<div class="custom-price-pin ${claseColor}">${starIndicator}<img src="${obtenerLogo(marca)}" class="pin-mini-logo" onerror="this.onerror=null; this.src='${FALLBACK_LOGO}'"><span>${precio.toFixed(3)}€</span></div>`,
                    iconSize: [75, 28], iconAnchor: [37.5, 14], popupAnchor: [0, -15] 
                });

                L.marker([lat, lng], { icon: priceIcon, riseOnHover: true }).bindPopup(popupHTML).addTo(capaPinesVisibles);
            });
        }

        map.on('moveend', actualizarPinesVisibles);
        map.on('zoomend', actualizarPinesVisibles);

        async function cargarGasolinerasGLP() {
            try {
                const respuesta = await fetch('https://sedeaplicaciones.minetur.gob.es/ServiciosRESTCarburantes/PreciosCarburantes/EstacionesTerrestres/');
                const datos = await respuesta.json();
                todasLasEstaciones = datos.ListaEESSPrecio.filter(estacion => estacion['Precio Gases licuados del petróleo'] !== "");
                localizarUsuario(); 
            } catch (error) { console.error("Error al cargar la API:", error); }
        }

        cargarGasolinerasGLP();

        function localizarUsuario() {
            navigator.geolocation.getCurrentPosition((posicion) => {
                const lat = posicion.coords.latitude, lng = posicion.coords.longitude;
                puntoReferenciaDistancia = L.latLng(lat, lng); 
                map.flyTo([lat, lng], 13, { duration: 1.5 });
                if (marcadorUbicacionUsuario) map.removeLayer(marcadorUbicacionUsuario);
                marcadorUbicacionUsuario = L.circleMarker([lat, lng], { radius: 8, fillColor: "#2563eb", color: "#ffffff", weight: 3, opacity: 1, fillOpacity: 0.9 }).addTo(map);
            }, () => actualizarPinesVisibles());
        }

        function manejarEntrada() {
            const query = document.getElementById('searchInput').value;
            if (query.length < 3) return;
            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=es&limit=5`)
                .then(r => r.json()).then(data => {
                    const res = document.getElementById('searchResults');
                    res.innerHTML = '';
                    data.forEach(item => {
                        const li = document.createElement('li');
                        li.textContent = item.display_name;
                        li.onclick = () => {
                            puntoReferenciaDistancia = L.latLng(item.lat, item.lon);
                            map.flyTo([item.lat, item.lon], 14);
                            res.style.display = 'none';
                            actualizarPinesVisibles();
                        };
                        res.appendChild(li);
                    });
                    res.style.display = 'block';
                });
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, deleteDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB_2thDoQUjLM34QYO8nmaDAB8HqQIxtIY",
            authDomain: "glpfinder.firebaseapp.com",
            projectId: "glpfinder",
            storageBucket: "glpfinder.firebasestorage.app",
            messagingSenderId: "173596798895",
            appId: "1:173596798895:web:d883035f89fa2c139fc95a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let usuarioActual = null;

        onAuthStateChanged(auth, async (user) => {
            const navAuth = document.getElementById('nav-auth');
            const navProfile = document.getElementById('nav-profile');
            if (user) {
                usuarioActual = user;
                if(navAuth) navAuth.style.display = 'none';
                if(navProfile) navProfile.style.display = 'inline-block';
                await cargarFavoritosUsuario(user.uid);
            } else {
                usuarioActual = null;
                misFavoritosIds = [];
                if(navAuth) navAuth.style.display = 'inline-block';
                if(navProfile) navProfile.style.display = 'none';
            }
            actualizarPinesVisibles();
        });

        async function cargarFavoritosUsuario(uid) {
            const snap = await getDocs(collection(db, "users", uid, "favoritos"));
            misFavoritosIds = snap.docs.map(doc => doc.id);
        }

        window.gestionarFavorito = async (id, nombre, lat, lng, direccion, localidad, precio) => {
            if (!usuarioActual) return window.location.href = "auth.html";
            const docRef = doc(db, "users", usuarioActual.uid, "favoritos", id);
            if (misFavoritosIds.includes(id)) {
                await deleteDoc(docRef);
                misFavoritosIds = misFavoritosIds.filter(fid => fid !== id);
            } else {
                await setDoc(docRef, { nombre, lat, lng, direccion, localidad, precio, fecha: new Date() });
                misFavoritosIds.push(id);
            }
            actualizarPinesVisibles();
        };

        document.getElementById('btn-logout').onclick = (e) => {
            e.preventDefault();
            signOut(auth).then(() => window.location.reload());
        };
    </script>
</body>
</html>
